          }
        }
      } else if (d.mode === 'clubRide') {
        // v25：乘 Club 梯升降（站在 340° 玻璃井内随高度移动，面向厅门）
        d.clubT += dt;
        const cu = Math.min(d.clubT / d.clubDur, 1);
        const ce = cu < 0.5 ? 2 * cu * cu : 1 - Math.pow(-2 * cu + 2, 2) / 2;
        a.position.set(35.71, d.clubFromY + (d.clubToY - d.clubFromY) * ce, -13.0);
        a.rotation.y = Math.atan2(32.5 - 35.71, -11.8 + 13.0);
        if (cu >= 1) {
          d.curFloor = d.destFloor;
          d.baseY = floorY(d.destFloor);
          a.position.set(32.5, d.baseY, -11.8);
          d.mode = 'exitWalk';
          if (d.goingHome) {
            d.tx = d.cx; d.tz = d.cz;
            d.afterExit = (d.seatX !== undefined) ? 'toSeat' : 'wander';
          } else if (d.destFloor === 6) {
            d.tx = 33.5; d.tz = -5.5; d.returnT = 20 + Math.random() * 20;   // 上天台 Club 逛一会儿
            d.afterExit = 'returnWait';
          } else {
            d.tx = 29.5; d.tz = -8.5; d.returnT = 6 + Math.random() * 10;
            d.afterExit = 'returnWait';
          }
        }
      } else if (d.mode === 'toLeisure') {
        // v32：走向休闲位（走法同回座，走廊绕行 arcSteer）
        const sp = d.leisure;
        if (!sp) { d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander'; }
        else {
          const dx = sp.x - a.position.x, dz = sp.z - a.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 0.3) {
            a.position.set(sp.x, d.baseY, sp.z);

            d.mode = 'leisureUse'; d.useT = 30 + Math.random() * 50;
          } else {
            const stp = arcSteer(a.position.x, a.position.z, sp.x, sp.z);
            const sdx = stp[0] - a.position.x, sdz = stp[1] - a.position.z;
            const sdist = Math.hypot(sdx, sdz) || 1;
            a.position.x += sdx / sdist * d.speed * dt;
            a.position.z += sdz / sdist * d.speed * dt;
            a.rotation.y = Math.atan2(sdx, sdz);
            a.position.y = d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06;
          }
        }
      } else if (d.mode === 'leisureUse') {
        // v32：使用器材中——跑步机上原地跑动，街机/台球前站着玩
        const sp = d.leisure;
        if (!sp) { d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander'; }
        else {
          a.position.x = sp.x; a.position.z = sp.z;
          a.rotation.y = sp.rotY;
          a.position.y = sp.kind === 'gym' ? d.baseY + Math.abs(Math.sin(t * 7.5 + d.ph)) * 0.055 : d.baseY;
          d.useT -= dt;
          if (d.useT <= 0) {
            sp.by = null; d.leisure = null;
            d.leisureT = 240 + Math.random() * 240;   // 冷却 4~8 分钟再去
            if (d.curFloor === d.homeFloor) d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander';
            else { d.mode = 'toElevator'; d.goingHome = true; setLiftTarget(d); }
          }
        }
      } else if (d.mode === 'returnWait') {
        d.returnT -= dt;
        if (d.returnT <= 0) {
          if (d.curFloor === d.homeFloor) {
            // 已回到本层 → 直接回座/继续漫游，不再坐电梯（也避免落座到错误楼层）
            d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander';
            d.tripTimer = 3 + Math.random() * 5;
          } else {
            d.mode = 'toElevator'; d.goingHome = true; setLiftTarget(d);
          }
        }
      }

      /* ---- 随机工位动作 / 移动摆臂（肩/颈枢组） ---- */
      applyAgentAction(a, d, t, dt);

      /* ---- 头顶对话气泡：间歇弹出（限并发：全楼同时最多 6 人讲话；滑梯中收起） ---- */
      const sp = d.speech;

        if (d.mode === 'sliding') {

          d.speechShow = 0;
        } else if (d.speechShow > 0) {

            } else {

              const arr = work ? WORK_TEXS : CHAT_TEXS;

              sp.visible = true;
              activeSpeech++;
              d.speechShow = 4 + Math.random() * 3;
              d.speechT = 9 + Math.random() * 14;
            }
          }
        }
      }
    }

    /* ---- 公园球场：球员跑动 + 球弹跳 ---- */
    for (let i = 0; i < sportsPlayers.length; i++) {
      const p = sportsPlayers[i], d = p.userData;
      if (d.bbGame || d.tnGame) continue;   // v23：篮球/网球球员由比赛模拟驱动
      const t2 = t * 0.9 + d.phase;
      p.position.x = d.homeX + Math.sin(t2) * 0.9;
      p.position.z = d.homeZ + Math.cos(t2 * 0.8) * 0.7;
      p.position.y = Math.abs(Math.sin(t2 * 5)) * 0.14;
      p.rotation.y = Math.cos(t2) > 0 ? 0.5 : -0.5;
    }
    for (let i = 0; i < sportsBalls.length; i++) {
      const b = sportsBalls[i], d = b.userData;
      if (d.bbGame || d.tnGame) continue;   // v23：篮球/网球的球由比赛模拟驱动
      if (d.followPlayer) {   // v13 篮球：球跟着持球人（运球弹跳）
        b.position.x = d.followPlayer.position.x + 0.38;
        b.position.z = d.followPlayer.position.z + 0.15;
        b.position.y = d.r + Math.abs(Math.sin(t * 6.5 + d.phase)) * 0.5;
        continue;
      }
      const t2 = t * 1.3 + d.phase;
      b.position.x = d.homeX + Math.sin(t2) * d.ampX;
      b.position.z = d.homeZ + Math.sin(t2 * 0.9) * d.ampZ;
      b.position.y = d.r + Math.abs(Math.sin(t2 * 3.2)) * d.bounceH;
    }

    /* ---- v43 球场作息：8:00–23:30 开场（与哥斯拉同窗口），关场收人收球停赛 ---- */
    const courtsOpenNow = timeState.h >= 8 && timeState.h < 23.5;
    if (courtsOpenNow !== _courtsOpen) {
      _courtsOpen = courtsOpenNow;
      bbGames.forEach(function (gm2) { gm2.reds.concat(gm2.blues).forEach(function (p) { p.visible = _courtsOpen; }); gm2.ball.visible = _courtsOpen; });
      tnGames.forEach(function (gm2) { gm2.sideA.concat(gm2.sideB).forEach(function (p) { p.visible = _courtsOpen; }); gm2.ball.visible = _courtsOpen; });
    }
    /* ---- v23 篮球比赛：传球推进 + 投篮 + 攻守转换 ---- */
    for (let gi = 0; gi < bbGames.length; gi++) {
      const gm = bbGames[gi];
      if (!_courtsOpen) continue;
      if (gm.flight) {
        const fl = gm.flight;
        fl.t += dt;
        const u = Math.min(fl.t / fl.T, 1);
        gm.ball.position.set(
          fl.fx + (fl.tx - fl.fx) * u,
          fl.fy + (fl.ty - fl.fy) * u + Math.sin(u * Math.PI) * fl.arc,
          fl.fz + (fl.tz - fl.fz) * u
        );
        if (u >= 1) {
          if (fl.shot) {   // 投篮结束：攻守转换，对方持球反攻另一端
            gm.atk = 1 - gm.atk; gm.dir = -gm.dir; gm.passes = 0; gm.passT = 1.4;
            const nteam = gm.atk === 0 ? gm.reds : gm.blues;
            gm.holder = nteam[Math.floor(Math.random() * nteam.length)];
          } else {
            gm.holder = fl.to; gm.passes++; gm.passT = 1.1 + Math.random() * 1.7;
          }
          gm.flight = null;
        }
      } else if (gm.holder) {
        gm.ball.position.set(gm.holder.position.x + 0.38, 0.24 + Math.abs(Math.sin(t * 6.5)) * 0.5, gm.holder.position.z + 0.15);
        gm.passT -= dt;
        if (gm.passT <= 0) {
          const team = gm.atk === 0 ? gm.reds : gm.blues;
          const hp = gm.holder.position;
          if (gm.passes >= 3 + (gi % 2)) {   // 传够次数：投篮
            gm.flight = { fx: hp.x, fy: 1.6, fz: hp.z, tx: gm.cx, ty: 3.05, tz: gm.cz + gm.dir * 12.425, t: 0, T: 0.75, arc: 1.7, shot: true, to: null };
          } else {   // 传给队友
            let mate = team[Math.floor(Math.random() * team.length)];
            if (mate === gm.holder) mate = team[(team.indexOf(mate) + 1) % team.length];
            gm.flight = { fx: hp.x, fy: 1.5, fz: hp.z, tx: mate.position.x, ty: 1.2, tz: mate.position.z, t: 0, T: 0.45, arc: 0.9, shot: false, to: mate };
          }
        }
      }
      for (let ti = 0; ti < 2; ti++) {
        const team = ti === 0 ? gm.reds : gm.blues;
        const slots = (gm.atk === ti) ? BB_ATK : BB_DEF;
        for (let pi = 0; pi < team.length; pi++) {
          const p = team[pi], pd = p.userData, sl = slots[pd.bbSlot];
          const txp = gm.cx + sl[0] + Math.sin(t * 0.6 + pd.phase * 2) * 0.7;
          const tzp = gm.cz + gm.dir * sl[1] + Math.cos(t * 0.5 + pd.phase) * 0.6;
          const dx = txp - p.position.x, dz = tzp - p.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist > 0.05) {
            const step = Math.min(dist, 3.6 * dt);
            p.position.x += dx / dist * step;
            p.position.z += dz / dist * step;
            p.rotation.y = Math.atan2(dx, dz);
          } else if (gm.ball) {
            p.rotation.y = Math.atan2(gm.ball.position.x - p.position.x, gm.ball.position.z - p.position.z);
          }
          p.position.y = Math.abs(Math.sin(t * 5 + pd.phase)) * (dist > 0.4 ? 0.13 : 0.03);
        }
      }
    }

    /* ---- v23 网球对拉：球过网往返、球员追球（单打/双打） ---- */
    for (let gi = 0; gi < tnGames.length; gi++) {
      const gm = tnGames[gi];
      if (!_courtsOpen) continue;
      if (gm.flight) {
        const fl = gm.flight;
        fl.t += dt;
        const u = Math.min(fl.t / fl.T, 1);
        gm.ball.position.set(
          fl.fx + (fl.tx - fl.fx) * u,
          fl.fy + (fl.ty - fl.fy) * u + Math.sin(u * Math.PI) * fl.arc,
          fl.fz + (fl.tz - fl.fz) * u
        );
        if (u >= 1) {
          gm.holderSide = fl.toSide;
          gm.hits++;
          gm.waitT = gm.hits > 6 + (gi % 3) * 2 ? 1.3 : 0.1;   // 一分打完（7~11 拍）停顿久些再发球
          if (gm.waitT > 0.5) gm.hits = 0;
          gm.flight = null;
        }
      } else {
        gm.waitT -= dt;
        const sideArr = gm.holderSide === 0 ? gm.sideA : gm.sideB;
        const srv = sideArr[0];
        if (srv) gm.ball.position.set(srv.position.x + 0.3, 0.65 + Math.sin(t * 3) * 0.05, srv.position.z + (gm.holderSide === 0 ? -0.3 : 0.3));
        if (gm.waitT <= 0 && srv) {   // 击向对面半场
          const toSide = 1 - gm.holderSide;
          gm.flight = { fx: srv.position.x, fy: 1.1, fz: srv.position.z, tx: gm.cx + (Math.random() - 0.5) * 6.4, ty: 0.4, tz: gm.cz + (toSide === 0 ? -1 : 1) * (6.2 + Math.random() * 3.4), t: 0, T: 0.8, arc: 1.5, toSide: toSide };
        }
      }
      for (let si = 0; si < 2; si++) {
        const arr = si === 0 ? gm.sideA : gm.sideB;
        const sgn = si === 0 ? -1 : 1;
        for (let pi = 0; pi < arr.length; pi++) {
          const p = arr[pi], pd = p.userData;
          let txp = gm.ball.position.x;
          if (arr.length === 2) {   // 双打：只追自己半场的球
            const half = pd.tnHalf;
            txp = (Math.sign(gm.ball.position.x - gm.cx) === half) ? gm.ball.position.x : gm.cx + half * 1.8;
          }
          txp = THREE.MathUtils.clamp(txp, gm.cx - 4.6, gm.cx + 4.6);
          const tzp = gm.cz + sgn * 8.4;
          const dx = txp - p.position.x, dz = tzp - p.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist > 0.05) {
            const step = Math.min(dist, 4.4 * dt);
            p.position.x += dx / dist * step;
            p.position.z += dz / dist * step;
            p.rotation.y = Math.atan2(dx, dz);
          } else {
            p.rotation.y = sgn < 0 ? 0 : Math.PI;   // 面向球网
          }
          p.position.y = Math.abs(Math.sin(t * 5.5 + pd.phase)) * 0.08;
        }
      }
    }

    /* ---- 公园作息（v24）：人按窗口在场（上班回楼里/晚上回家），宠物夜里回窝睡觉 ---- */
    if (!parkSchedInit) {   // 首帧一次性分配在场窗口（带个人随机抖动）
      parkSchedInit = true;
      const jit = function () { return (Math.random() - 0.5) * 0.5; };
      for (let i = 0; i < parkWalkers.length; i++) {
        const ud = parkWalkers[i].userData;
        if (ud.pet) continue;
        const hx = ud.walk.homeX, hz = ud.walk.homeZ;
        if (hx < -30 && hz > 30) ud.parkWins = [[8.8 + jit(), 20.8 + jit()]];              // Apple 店员/顾客：营业时间
        else if (hz > 125) ud.parkWins = [[8.9 + jit(), 18.7 + jit()]];                    // v30 海滩游客：白天在场
        else {
          ud.parkWins = [[12.35 + jit(), 13.65 + jit()], [16.9 + jit(), 20.3 + jit()]];    // 员工型：午休 + 下班后
          if (Math.random() < 0.35) ud.parkWins.push([6.9 + jit(), 8.8 + jit()]);          // 部分人清晨也在
        }
      }
      for (let i = 0; i < parkStatics.length; i++) {
        const j2 = (Math.random() - 0.5) * 0.6;
        parkStatics[i].userData.sunWin = [9.3 + j2, 17.2 + j2];                            // 晒太阳的访客：只在白天
      }
    }
    const parkNight = timeState.h >= 21 || timeState.h < 6;
    for (let i = 0; i < parkWalkers.length; i++) {
      const w = parkWalkers[i], ud = w.userData, d = ud.walk;
      if (ud.pet) {
        if (parkNight) {   // 动物睡觉：回窝趴下（压扁成趴卧状）不动
          w.position.set(d.homeX, 0, d.homeZ);
          w.scale.y = 0.45;
          continue;
        }
        w.scale.y = 1;
      } else {
        let on = false;
        const wins = ud.parkWins || [];
        for (let wi = 0; wi < wins.length; wi++) if (timeState.h >= wins[wi][0] && timeState.h < wins[wi][1]) { on = true; break; }
        if (!on) { if (w.visible) w.visible = false; continue; }
        if (!w.visible) w.visible = true;
      }
      const t3 = t * d.speed + d.phase;
      w.position.x = d.homeX + Math.cos(t3) * d.r;
      w.position.z = d.homeZ + Math.sin(t3) * d.r;
      w.rotation.y = Math.atan2(-Math.sin(t3), Math.cos(t3));
      if (d.bob) w.position.y = Math.abs(Math.sin(t3 * 6)) * 0.05;
    }
    for (let i = 0; i < parkStatics.length; i++) {
      const sw = parkStatics[i], win = sw.userData.sunWin || [9.3, 17.2];
      sw.visible = timeState.h >= win[0] && timeState.h < win[1];
    }

    /* ---- HUD 时钟 ---- */
    hudTick -= dt;
    if (hudTick <= 0) {
      hudTick = 0.25;
      const hud = getHud();
      if (hud.clock) {
        const hh = Math.floor(timeState.h), mm = Math.floor((timeState.h - hh) * 60);
        hud.clock.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
      }
      if (hud.period) hud.period.textContent = periodName(timeState.h);
      if (hud.work) hud.work.style.display = timeState.work ? 'inline' : 'none';
      if (hud.rush) hud.rush.style.display = timeState.rush ? 'inline' : 'none';
      if (hud.slider && document.activeElement !== hud.slider) hud.slider.value = String(timeState.h);
    }

    renderer.render(scene, camera);
    if (onTick) onTick(t, dt);
  }
  animate();

  /* ---------------- 对外 API ---------------- */
  const api = {
    scene: scene,
    camera: camera,
    renderer: renderer,
    controls: controls,
    agents: agentList,
    agentConfigs: AGENTS,
    timeState: timeState,
    elevator: elevator,
    sports: { players: sportsPlayers, balls: sportsBalls },
    slide: slide,
    lens: lensMesh,
    godzilla: godzilla,
    rocket: rocket,
    jetAnim: jetAnim,
    extras: extras,
    sky: { clouds: cloudSprites, moon: moonSprite },
    fountain: { jets: fountainJets, group: scene.getObjectByName('fountain') },
    speech: { chat: CHAT_PHRASES, work: WORK_PHRASES },
    seats: seatList,
    directorSeats: directorSeats,
    constants: { FLOOR_H: FLOOR_H, FLOOR_COUNT: FLOOR_COUNT, TOTAL_H: TOTAL_H, floorY: floorY },
    focusFloor: focusFloor,
    dispose: function () {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      if (ro) ro.disconnect();
      controls.dispose();
      scene.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
  try { onReady(api); } catch (e) { console.error(e); }
  return api;
}

/* =====================================================================
 * 启动
 * ===================================================================== */
const loadingEl = document.getElementById('loading');
const sceneApi = createOfficeScene(document.getElementById('office-container'), {
  onReady: function (api) {
    loadingEl.style.opacity = '0';
    setTimeout(function () { loadingEl.remove(); }, 650);
    window.officeScene = api;
    // HUD 楼层聚焦按钮
    document.getElementById('floor-btns').addEventListener('click', function (e) {
      const f = e.target.getAttribute('data-f');
      if (f !== null) {
        api.focusFloor(parseInt(f, 10));
        document.querySelectorAll('#floor-btns button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-f') === f);
        });
      }
    });
    // 时间面板：24 小时滑块 + 自动/暂停
    const slider = document.getElementById('time-slider');
    const autoBtn = document.getElementById('time-auto');
    if (slider && autoBtn) {
      slider.addEventListener('input', function () {
        api.timeState.auto = false;
        api.timeState.h = parseFloat(slider.value) || 0;
        autoBtn.textContent = '继续流转';
        autoBtn.classList.add('paused');
      });
      autoBtn.addEventListener('click', function () {
        api.timeState.auto = !api.timeState.auto;
        autoBtn.textContent = api.timeState.auto ? '暂停时间' : '继续流转';
        autoBtn.classList.toggle('paused', !api.timeState.auto);
      });
    }
  },
  onAgentSelect: function (info) {
    const tip = document.getElementById('tip');
    const roomName = { lobby: '前台接待', ops: 'OPS运营部', fin: '财务部', hr: '人事部',
      log: '后勤部', mkt: '营销部', sales: '销售部', chairman: '主席办公室', secretary: '秘书台', bar: '天台酒吧',
      cafeteria: '员工食堂', starbucks: '星巴克' }[info.room] || info.room;
    tip.textContent = info.en + '（' + info.name + '）· ' + (info.role || 'Staff') + ' · ' + info.floor + 'F · ' + roomName;
  },
  onError: function (err) {
    loadingEl.textContent = '初始化失败: ' + (err && err.message ? err.message : err);
    console.error(err);
  }
});
</script>
<script>
(function () {
  function makeDraggable(el) {
    if (!el) return;
    var sx = 0, sy = 0, ox = 0, oy = 0, on = false;
    el.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (e.target.closest('button, input, a, select, textarea')) return;
      var r = el.getBoundingClientRect();
      el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
      el.style.right = 'auto'; el.style.bottom = 'auto'; el.style.transform = 'none';
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; on = true;
      el.classList.add('dragging');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (!on) return;
      var w = el.offsetWidth, h = el.offsetHeight;
      var nx = Math.min(Math.max(ox + e.clientX - sx, -w + 48), window.innerWidth - 48);
      var ny = Math.min(Math.max(oy + e.clientY - sy, 0), window.innerHeight - 32);
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    });
    function end() { on = false; el.classList.remove('dragging'); }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  makeDraggable(document.getElementById('hud'));
  makeDraggable(document.getElementById('time-panel'));
})();
</script>
