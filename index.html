<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
 * createOfficeScene(container, callbacks)
 * 单文件封装的 Three.js 办公大楼场景：
 *  - createOutdoor()        宏观环境（满铺公园/多树种/篮球场+网球场/停车场/天际线/连廊）
 *  - createSkyObjects()     天空：8 朵白云环绕漂移（昼浓夜淡）+ 圆月沿太阳反弧线升落（夜间显）
 *  - createBuildingCore()   楼体骨架（1F 双高/楼板/角柱/透明玻璃幕墙/银色电梯井/旋转滑梯/外裹浅蓝薄透镜）
 *  - createLobby()          1F 大堂（Dopplers. 标识/雕塑/水晶大吊灯）+ 食堂 + 星巴克 + 收发室
 *  - createFloor2/3/4()     2-4F 部门办公 + 两侧功能间（每层 8 间，三层摆设不同）+ 总监办公位
 *  - createChairmanRoom()   5F 主席办公室（仅 Mike + 秘书 Mandy）
 *  - createRoofClub()       6F 天台 Club（星光吧/无边际泳池/篝火/霓虹/集团大招牌）
 *  - createGodzilla()       楼外 5 层楼高哥斯拉：闭环路径绕楼散步（摆腿/摆臂/摆尾/起伏）
 *  - createAgents()         133 人（全员英文名 + 头顶黑色英文名牌 + 间歇英文对话气泡）：
 *                           工作时间（9:00-12:30 / 13:30-18:00）大多数人就坐工位（主席 Mike 除外），
 *                           2F~6F 每层可滑旋转滑梯；2-4F 总监定期乘电梯上 5F 拜会 Mike（Mike/Mandy 常驻 5F 不下楼）
 *  - updateDayNight(h)      24 小时时间系统（日升日落/通勤高峰/夜景亮灯/白云圆月）
 * ===================================================================== */
function createOfficeScene(container, callbacks) {
  callbacks = callbacks || {};
  const onReady = callbacks.onReady || function () {};
  const onError = callbacks.onError || function () {};
  const onTick = callbacks.onTick || null;

  /* ---------------- 全局常量 ---------------- */
  const FLOOR_H = 4.6;                 // 每层高度（原 4.5 ×1.5）
  const FLOOR_COUNT = 6;               // 1F ~ 6F
  const F1_H = FLOOR_H;            // 1F 双高挑空大堂（原层高 ×2）
  const BW = 36, BD = 30;              // 楼体宽 / 深
  const HW = BW / 2, HD = BD / 2;      // 18 / 15
  const SLAB = 0.3;                    // 楼板厚度
  const TOTAL_H = F1_H + (FLOOR_COUNT - 1) * FLOOR_H; // 47.25
  const floorY = (f) => f <= 1 ? 0 : F1_H + (f - 2) * FLOOR_H; // 1F=0 2F=13.5 3F=20.25 4F=27 5F=33.75 6F=40.5

  /* ---------------- 渲染器 / 场景 / 相机 ---------------- */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87bfe8);
  scene.fog = new THREE.Fog(0x87bfe8, 380, 1500);   // v37：雾距随场地放大（原 240/620，拉远看全场会被洗白）

  const camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.1, 3000);   // v36 远裁剪面放宽，拉远不丢远景
  camera.position.set(63, 43, 87);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    onError(e);
    return null;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.14;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 21, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 22;
  controls.maxDistance = 750;   // v36：场地摊大后（西火箭↔东跑道约 700m）全景要能一次收全
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.32;

  /* ---------------- 程序化贴图（Canvas 纹理） ---------------- */
  function canvasTex(size, draw, repeat) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    t.anisotropy = 4;
    return t;
  }
  // 大理石纹理（背景墙）
  const marbleTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#f5f2e9'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 55; i++) {
      g.fillStyle = 'rgba(175,178,185,0.16)';
      g.beginPath();
      g.ellipse(Math.random() * s, Math.random() * s, 30 + Math.random() * 90, 18 + Math.random() * 60, Math.random() * 3, 0, Math.PI * 2);
      g.fill();
    }
    g.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      g.strokeStyle = 'rgba(110,115,128,' + (0.14 + Math.random() * 0.24).toFixed(2) + ')';
      g.lineWidth = 0.6 + Math.random() * 1.8;
      g.beginPath();
      let x = Math.random() * s, y = Math.random() * s;
      g.moveTo(x, y);
      for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 170; y += (Math.random() - 0.5) * 170; g.lineTo(x, y); }
      g.stroke();
    }
  }, [2, 1]);
  // 木纹（会议桌 / 班台 / 甲板）
  function woodTex(base, vein, repeat) {
    return canvasTex(512, (g, s) => {
      g.fillStyle = base; g.fillRect(0, 0, s, s);
      for (let i = 0; i < 90; i++) {
        g.strokeStyle = 'rgba(' + vein + ',' + (0.05 + Math.random() * 0.13).toFixed(2) + ')';
        g.lineWidth = 0.5 + Math.random() * 2.5;
        const y0 = Math.random() * s;
        g.beginPath(); g.moveTo(0, y0);
        for (let x = 0; x <= s; x += 32) g.lineTo(x, y0 + Math.sin(x * 0.02 + i) * 6 + (Math.random() - 0.5) * 3);
        g.stroke();
      }
    }, repeat);
  }
  const woodDarkTex = woodTex('#3a2417', '20,10,5', [3, 1]);
  const mahoganyTex = woodTex('#6e1423', '40,6,14', [2, 1]);
  const deckTex = woodTex('#a08059', '80,58,32', [6, 5]);
  // 红底描金地毯
  const carpetTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#7c1220'; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(212,175,55,0.9)'; g.lineWidth = 9; g.strokeRect(26, 26, s - 52, s - 52);
    g.strokeStyle = 'rgba(212,175,55,0.32)'; g.lineWidth = 2;
    for (let i = -s; i < s * 2; i += 44) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.stroke();
      g.beginPath(); g.moveTo(i, s); g.lineTo(i + s, 0); g.stroke();
    }
    g.fillStyle = 'rgba(212,175,55,0.5)';
    g.beginPath(); g.arc(s / 2, s / 2, 72, 0, Math.PI * 2); g.fill();
  }, [2, 1.5]);
  // 白色马赛克
  const mosaicTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#f6f6f2'; g.fillRect(0, 0, s, s);
    const n = 16, cell = s / n;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 236 + Math.random() * 16;
      g.fillStyle = 'rgb(' + (v | 0) + ',' + (v | 0) + ',' + ((v - 3) | 0) + ')';
      g.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
    }
  }, [6, 4]);
  // 天际线窗户（大幅玻璃窗带 + 窗框分割，夜间亮灯）
  const windowTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#2a3852'; g.fillRect(0, 0, s, s);            // 楼体（提亮为蓝灰）
    g.fillStyle = '#1b2436'; g.fillRect(0, 0, s, 10);           // 顶部楼檐
    const bands = 3, bh = s / bands;                            // 3 条横向窗带
    for (let b = 0; b < bands; b++) {
      const y0 = b * bh + 16, h = bh - 30;
      // 窗带玻璃（上下暗渐变模拟反射）
      const grad = g.createLinearGradient(0, y0, 0, y0 + h);
      grad.addColorStop(0, '#3a5c8c'); grad.addColorStop(0.5, '#527cae'); grad.addColorStop(1, '#2e4e7a');
      g.fillStyle = grad; g.fillRect(14, y0, s - 28, h);
      // 竖向窗框
      g.fillStyle = 'rgba(90,105,135,0.55)';
      for (let x = 14 + 26; x < s - 14; x += 26) g.fillRect(x, y0, 3, h);
      // 亮灯房间（整格点亮，更像有人办公的窗户）
      for (let x = 14 + 6; x < s - 20; x += 26) {
        if (Math.random() > 0.42) {
          const v = 0.5 + Math.random() * 0.5;
          g.fillStyle = 'rgb(' + (255 * v | 0) + ',' + (238 * v | 0) + ',' + (185 * v | 0) + ')';
          g.fillRect(x, y0 + 5, 20, h - 10);
          // 窗内人物剪影
          if (Math.random() > 0.55) {
            g.fillStyle = 'rgba(20,26,40,0.5)';
            g.fillRect(x + 6, y0 + h - 22, 8, 14);
          }
        }
      }
      // 窗带下沿楼板线
      g.fillStyle = 'rgba(70,82,108,0.5)'; g.fillRect(14, y0 + h, s - 28, 4);
    }
  });
  // 星巴克招牌
  const starbucksTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#00704a'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#ffffff'; g.lineWidth = 7;
    g.beginPath(); g.arc(s / 2, s / 2, s * 0.4, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#ffffff'; g.textAlign = 'center';
    g.font = 'bold 46px "Microsoft YaHei", sans-serif';
    g.fillText('星巴克', s / 2, s / 2 - 2);
    g.font = 'bold 22px sans-serif';
    g.fillText('STARBUCKS COFFEE', s / 2, s / 2 + 36);
  });
  // 天台霓虹灯牌
  const neonTex = canvasTex(512, (g, s) => {
    g.clearRect(0, 0, s, s);
    g.textAlign = 'center';
    g.shadowColor = '#ff2d95'; g.shadowBlur = 26;
    g.fillStyle = '#ffd6ec';
    g.font = 'bold 74px "Microsoft YaHei", sans-serif';
    g.fillText('星空天台 CLUB', 256, 78);
    g.shadowColor = '#38e8ff'; g.shadowBlur = 18;
    g.fillStyle = '#bff3ff';
    g.font = 'bold 34px sans-serif';
    g.fillText('R O O F T O P   C L U B', 256, 118);
  });
  // 非正方形画布纹理（招牌 / 名签用）
  function canvasTexWH(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  // v47：同心蓝圈 Logo 标（canvas 版，配色按原图取色：底 #0c0e19，三圈 #232a52/#344284/#5060d0；
  // 原图中心是空的，不画中心点；lwF 为圈线粗细系数，默认 0.17，大招牌用细圈 0.09）
  function drawLogoMark(g, cx, cy, r, chip, lwF) {
    if (chip) {
      g.fillStyle = '#0c0e19';
      g.beginPath(); g.roundRect(cx - r * 1.15, cy - r * 1.15, r * 2.3, r * 2.3, r * 0.5); g.fill();
    }
    g.lineWidth = Math.max(1.5, r * (lwF || 0.17));
    [['#232a52', r], ['#344284', r * 0.66], ['#5060d0', r * 0.36]].forEach(function (rg) {
      g.beginPath(); g.strokeStyle = rg[0]; g.arc(cx, cy, rg[1], 0, Math.PI * 2); g.stroke();

  /* ---- 多树种：球冠树 / 松树 / 棕榈 /  plume 庭荫树 / 塔柏 / 灌木 ---- */
  function createPine(x, z, s) {                       // 层叠松
    const g = grp();
    cyl(0.2 * s, 0.3 * s, 1.6 * s, 8, MAT.trunk, 0, 0.8 * s, 0, g);
    for (let i = 0; i < 3; i++) {
      const c = new THREE.Mesh(new THREE.ConeGeometry((1.7 - i * 0.42) * s, 1.5 * s, 10),
        i === 0 ? MAT.leaf3 : (i === 1 ? MAT.leaf1 : MAT.leaf2));
      c.position.set(0, (1.9 + i * 1.05) * s, 0);
      c.castShadow = true;
      g.add(c);
    }
    g.position.set(x, 0, z);
    return g;
  }
  function createPalm(x, z, s) {                       // 棕榈（弯干 + 羽叶）
    const g = grp();
    let px = 0, py = 0;
    for (let i = 0; i < 5; i++) {
      cyl(0.16 * s, 0.2 * s, 1.1 * s, 7, MAT.trunk, px, py + 0.55 * s, 0, g);
      px += 0.22 * s; py += 0.95 * s;
    }
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const frond = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 2.4 * s),
        i % 2 ? MAT.leaf1 : MAT.leaf2);
      frond.position.set(px + Math.cos(a) * 1.0 * s, py + 0.2, Math.sin(a) * 1.0 * s);
      frond.rotation.y = -a;
      frond.rotation.x = 0.42;
      frond.castShadow = true;
      g.add(frond);
    }
    sph(0.28 * s, MAT.leaf3, px, py + 0.25, 0, g, 8);
    g.position.set(x, 0, z);
    return g;

  /* ---- 运动场：篮球 / 网球（含打球小人与球，动画驱动） ---- */
  function createSportsPlayer(x, z, color, phase) {
    const g = grp();
    const skin = MAT.agentSkin;
    cyl(0.11, 0.11, 0.5, 8, skin, -0.14, 0.25, 0, g);          // 双腿
    cyl(0.11, 0.11, 0.5, 8, skin, 0.14, 0.25, 0, g);

    cyl(0.34, 0.4, 0.85, 10, jersey, 0, 0.85, 0, g);           // 球衣
    cyl(0.08, 0.08, 0.65, 8, jersey, -0.42, 0.85, 0, g).rotation.z = 0.2;
    cyl(0.08, 0.08, 0.65, 8, jersey, 0.42, 0.85, 0, g).rotation.z = -0.2;
    sph(0.26, skin, 0, 1.55, 0, g, 12);                        // 头
    box(0.4, 0.1, 0.42, new THREE.MeshStandardMaterial({ color: 0x223, roughness: 0.7 }), 0, 1.68, 0, g); // 发带
    g.traverse(function (o) { o.castShadow = true; });
    g.position.set(x, 0, z);
    g.userData = { homeX: x, homeZ: z, phase: phase };
    sportsPlayers.push(g);
    return g;
  }
  function createSportsBall(x, z, r, color, bounceH, ampX, ampZ) {
    const b = sph(r, new THREE.MeshStandardMaterial({ color: color, roughness: 0.65 }), x, r, z, null, 14);
    b.castShadow = true;
    b.userData = { homeX: x, homeZ: z, phase: Math.random() * 6.28, r: r, bounceH: bounceH, ampX: ampX || 2.6, ampZ: ampZ || 1.4 };
    sportsBalls.push(b);
    return b;
  }
  function createBasketballCourt(cx, cz) {
    const g = grp();
    const W = 15, D = 28;   // 标准尺度：宽 15m（x）× 长 28m（z），与网球场同向（长轴沿 z），篮筐在 z 两端
    const courtMat = new THREE.MeshStandardMaterial({ color: 0xb0713a, roughness: 0.75 }); // 木地板
    box(W, 0.06, D, courtMat, cx, 0.07, cz, g);
    // 边线（长边沿 z、短边沿 x）+ 中线
    box(W, 0.02, 0.16, MAT.line, cx, 0.11, cz - D / 2 + 0.1, g);
    box(W, 0.02, 0.16, MAT.line, cx, 0.11, cz + D / 2 - 0.1, g);
    box(0.16, 0.02, D, MAT.line, cx - W / 2 + 0.1, 0.11, cz, g);
    box(0.16, 0.02, D, MAT.line, cx + W / 2 - 0.1, 0.11, cz, g);
    box(W, 0.02, 0.16, MAT.line, cx, 0.11, cz, g);
    // 中圈
    const circle = new THREE.Mesh(new THREE.RingGeometry(1.9, 2.05, 28), MAT.line);
    circle.rotation.x = -Math.PI / 2;
    circle.position.set(cx, 0.11, cz);
    g.add(circle);
    // 两侧篮架 + 罚球区 + 三分弧（全部以"篮筐投影"为基准：底线内 1.575m）
    [-1, 1].forEach(function (side) {
      const hz = cz + side * (D / 2 - 1.575);         // 篮筐投影（z 方向，距中线 12.425m）
      // 罚球区：宽 4.9m（x）× 深 5.8m（自底线至罚球线），罚球线距篮板 4.6m
      box(4.9, 0.02, 0.14, MAT.line, cx, 0.11, cz + side * 8.2, g);                    // 罚球线
      box(0.14, 0.02, 5.8, MAT.line, cx - 2.45, 0.11, cz + side * 11.1, g);            // 漆区西侧
      box(0.14, 0.02, 5.8, MAT.line, cx + 2.45, 0.11, cz + side * 11.1, g);            // 漆区东侧
      const ft = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.85, 24), MAT.line);      // 罚球圈
      ft.rotation.x = -Math.PI / 2;
      ft.position.set(cx, 0.11, cz + side * 8.2);
      g.add(ft);
      // 三分弧（半径 6.75m，以篮筐投影为圆心，向场内鼓；两端接贴边直线段）
      const arc = new THREE.Mesh(new THREE.RingGeometry(6.75, 6.9, 24, 1, side > 0 ? 0.2113 : -2.934, 2.72), MAT.line);
      arc.rotation.x = -Math.PI / 2;
      arc.position.set(cx, 0.11, hz);
      g.add(arc);
      box(0.14, 0.02, 3.0, MAT.line, cx - 6.6, 0.11, cz + side * 12.5, g);             // 三分线西直道
      box(0.14, 0.02, 3.0, MAT.line, cx + 6.6, 0.11, cz + side * 12.5, g);             // 三分线东直道
      // 篮架：立柱（篮板后）+ 篮板 + 篮圈 + 网
      box(0.22, 3.6, 0.22, MAT.metal, cx, 1.8, cz + side * 13.2, g);
      box(1.8, 1.05, 0.08, MAT.white, cx, 3.2, cz + side * 12.8, g);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.045, 8, 20), new THREE.MeshStandardMaterial({ color: 0xff5b30, roughness: 0.4, emissive: 0x901800, emissiveIntensity: 0.5 }));
      rim.rotation.x = -Math.PI / 2;
      rim.position.set(cx, 3.05, hz);
      g.add(rim);
      const net = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.3, 0.5, 10, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.65 }));
      net.position.set(cx, 2.8, hz);
      g.add(net);
    });
    // 球员 5v5 + 比赛模拟（v23：互相传球、全队向对方篮筐推进、投篮后攻守转换）
    const bbGame = { cx: cx, cz: cz, atk: 0, dir: 1, holder: null, passT: 1.6, passes: 0, flight: null, reds: [], blues: [], ball: null };
    for (let i = 0; i < 5; i++) {
      const rp = createSportsPlayer(cx + BB_ATK[i][0], cz + BB_ATK[i][1], 0xd63031, i * 1.3 + 0.4);
      rp.userData.bbGame = bbGame; rp.userData.bbTeam = 0; rp.userData.bbSlot = i;
      bbGame.reds.push(rp);
      const bp = createSportsPlayer(cx + BB_DEF[i][0], cz + BB_DEF[i][1], 0x1e6fd9, i * 1.1 + 2.2);
      bp.userData.bbGame = bbGame; bp.userData.bbTeam = 1; bp.userData.bbSlot = i;
      bbGame.blues.push(bp);
    }
    const bbBall = createSportsBall(cx, cz + 5, 0.24, 0xe8621a, 2.3, 1.6, 6.5);
    bbBall.userData.bbGame = bbGame;
    bbGame.ball = bbBall;
    bbGame.holder = bbGame.reds[0];
    bbGames.push(bbGame);
    return g;
  }
  function createTennisCourt(cx, cz, dbl) {   // v23：dbl=true 双打（2v2）、false 单打（1v1）
    const g = grp();
    const W = 11, D = 24;   // 单打场地：宽 11m（x）× 长 24m（z），球网横跨中路（沿 x 张开）
    box(W, 0.05, D, new THREE.MeshStandardMaterial({ color: 0x1e7fa8, roughness: 0.8 }), cx, 0.06, cz, g);
    // 底线（沿 x，位于 z 两端）+ 边线（沿 z，位于 x 两端）
    box(W, 0.02, 0.14, MAT.line, cx, 0.1, cz - D / 2 + 0.08, g);
    box(W, 0.02, 0.14, MAT.line, cx, 0.1, cz + D / 2 - 0.08, g);
    box(0.14, 0.02, D, MAT.line, cx - W / 2 + 0.08, 0.1, cz, g);
    box(0.14, 0.02, D, MAT.line, cx + W / 2 - 0.08, 0.1, cz, g);
    // 单打线（两侧内收 1.4m）
    box(0.1, 0.02, D - 1.6, MAT.line, cx - W / 2 + 1.4, 0.1, cz, g);
    box(0.1, 0.02, D - 1.6, MAT.line, cx + W / 2 - 1.4, 0.1, cz, g);
    // 发球线（距网 6.4m，沿 x）+ 中线
    box(W - 2.8, 0.02, 0.12, MAT.line, cx, 0.1, cz - 6.4, g);
    box(W - 2.8, 0.02, 0.12, MAT.line, cx, 0.1, cz + 6.4, g);
    box(0.12, 0.02, 12.8, MAT.line, cx, 0.1, cz, g);
    // 球网：立柱（x 两端）+ 网面 + 白边（横在场地中路，沿 x 张开）
    [-1, 1].forEach(function (side) {
      cyl(0.07, 0.09, 1.05, 8, MAT.metal, cx + side * (W / 2), 0.53, cz, g);
    });
    box(W, 0.85, 0.05, new THREE.MeshBasicMaterial({ color: 0xe8f0f8, transparent: true, opacity: 0.4 }), cx, 0.95, cz, g);
    box(W, 0.07, 0.07, MAT.line, cx, 1.4, cz, g);
    // 球员 + 对拉模拟（v23）：球过网往返、球员盯球移动；单打 1v1 / 双打 2v2
    const tnGame = { cx: cx, cz: cz, sideA: [], sideB: [], ball: null, flight: null, holderSide: 0, waitT: 0.5, hits: 0 };
    if (dbl) {
      tnGame.sideA.push(createSportsPlayer(cx - 2.3, cz - 8.4, 0xf5f6fa, 1.2));
      tnGame.sideA.push(createSportsPlayer(cx + 2.3, cz - 8.4, 0xf5f6fa, 2.6));
      tnGame.sideB.push(createSportsPlayer(cx - 2.3, cz + 8.4, 0x2ecc71, 4.0));
      tnGame.sideB.push(createSportsPlayer(cx + 2.3, cz + 8.4, 0x2ecc71, 5.1));
    } else {
      tnGame.sideA.push(createSportsPlayer(cx, cz - 8.4, 0xf5f6fa, 1.2));
      tnGame.sideB.push(createSportsPlayer(cx, cz + 8.4, 0x2ecc71, 4.0));
    }
    tnGame.sideA.forEach(function (p, i) { p.userData.tnGame = tnGame; p.userData.tnHalf = i === 0 ? -1 : 1; });
    tnGame.sideB.forEach(function (p, i) { p.userData.tnGame = tnGame; p.userData.tnHalf = i === 0 ? -1 : 1; });
    const tnBall = createSportsBall(cx, cz - 8, 0.13, 0xd9f24a, 1.8, 1.5, 8.5);
    tnBall.userData.tnGame = tnGame;
    tnGame.ball = tnBall;
    tnGames.push(tnGame);
    return g;
  }

  /* ---- 1F 大门前左侧喷泉：圆形石质池盆 + 水面 + 中心台座 + 数道脉冲水柱 ---- */
  function createFountain(x, z) {
    const g = grp();
    g.name = 'fountain';
    cyl(2.7, 2.78, 0.55, 26, MAT.marble, 0, 0.28, 0, g);              // 圆形石质池盆
    cyl(2.46, 2.46, 0.14, 26, MAT.dark, 0, 0.58, 0, g);               // 盆沿内圈（暗色水槽）
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x2f8fd8, roughness: 0.06, metalness: 0, transparent: true,
      opacity: 0.72, clearcoat: 1, clearcoatRoughness: 0.05,
      emissive: 0x0b3f6e, emissiveIntensity: 0.25, side: THREE.DoubleSide
    });
    const water = new THREE.Mesh(new THREE.CircleGeometry(2.4, 26), waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, 0.54, 0);
    g.add(water);
    cyl(0.42, 0.62, 1.15, 14, MAT.marble, 0, 1.13, 0, g);             // 中心台座
    sph(0.3, MAT.goldTrim, 0, 1.88, 0, g, 12);                        // 台座顶金珠
    // 水柱：中心主柱 + 内圈 6 道 + 外圈 8 道（半透明白蓝，animate 中脉冲缩放）
    const jetMat = new THREE.MeshBasicMaterial({ color: 0xcfeaff, transparent: true, opacity: 0.5, depthWrite: false });
    const mainJet = cyl(0.09, 0.13, 2.1, 8, jetMat, 0, 2.7, 0, g);
    mainJet.userData.phase = 0;
    fountainJets.push(mainJet);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const j = cyl(0.06, 0.09, 1.15, 6, jetMat, Math.cos(a) * 1.15, 1.15, Math.sin(a) * 1.15, g);
      j.rotation.z = -Math.sin(a) * 0.16;
      j.rotation.x = Math.cos(a) * 0.16;
      j.userData.phase = i * 0.7;
      fountainJets.push(j);
    }
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + 0.39;
      const j = cyl(0.07, 0.1, 1.7, 6, jetMat, Math.cos(a) * 1.85, 1.35, Math.sin(a) * 1.85, g);
      j.rotation.z = -Math.sin(a) * 0.34;
      j.rotation.x = Math.cos(a) * 0.34;
      j.userData.phase = 1.3 + i * 0.5;
      fountainJets.push(j);
    }
    const pl = new THREE.PointLight(0x9fd8ff, 16, 11, 2);             // 淡蓝点光源
    pl.position.set(0, 2.0, 0);
    g.add(pl);
    g.position.set(x, 0, z);
    return g;
  }

  function createBridge(x, z0, z1, y, w, name) {
    const g = grp();
    const len = z1 - z0, cz = (z0 + z1) / 2;
    box(w, 0.28, len, MAT.concrete, x, y - 0.16, cz, g);            // 桥面
    box(w + 0.4, 0.16, 0.16, MAT.metal, x, y + 1.16, z0 + 0.06, g); // 端横梁
    box(w + 0.4, 0.16, 0.16, MAT.metal, x, y + 1.16, z1 - 0.06, g);
    box(w, 1.05, 0.06, MAT.glass, x, y + 0.52, z0 + 0.04, g);       // 玻璃栏板
    box(w, 1.05, 0.06, MAT.glass, x, y + 0.52, z1 - 0.04, g);
    box(0.06, 1.05, len, MAT.glass, x - w / 2 + 0.04, y + 0.52, cz, g);
    box(0.06, 1.05, len, MAT.glass, x + w / 2 - 0.04, y + 0.52, cz, g);
    for (let i = 1; i < 5; i++) {                                    // 顶部等分横梁
      box(w + 0.3, 0.12, 0.12, MAT.metal, x, y + 1.1, z0 + len * i / 5, g);
    }
    g.position.set(0, 0, 0);
    if (name) g.name = name;
    return g;
  }

  function createOutdoor() {
    // 远景大地（v27：草地一路铺到地平线——与近处草坪同贴图、重复密度对齐，不再是深色空地）
    const farGrassTex = grassTex.clone();
    farGrassTex.repeat.set(55, 61);
    farGrassTex.needsUpdate = true;
    box(1700, 0.4, 1700, new THREE.MeshStandardMaterial({ map: farGrassTex, color: 0xffffff, roughness: 1 }), 0, -0.45, 0);
    // 基底
    box(320, 0.2, 260, MAT.concrete, 0, -0.1, 0);   // v8：画布加大覆盖全部 items
    // 公园草坪：铺满整个基底画布
    box(320, 0.06, 260, MAT.grass, 0, 0.03, 0);
    // 步行道（大堂前主通道 + 横向园路）
    const pathMat = new THREE.MeshStandardMaterial({ color: 0xddd5c2, roughness: 0.9 });
    box(4, 0.05, 46, pathMat, 0, 0.065, 38);
    box(76, 0.05, 4, pathMat, 0, 0.065, 40);
    // 1F 大门前左侧喷泉（主通道西侧空位）
    createFountain(-9, 19);
    /* ---- 篮球场 + 网球场（有人打球） ---- */

  function updateGodzilla(dt) {
    const g = godzilla;
    if (!g) return;
    const hh = timeState.h;                                          // v43 作息：8:00–23:30 在场，夜间回窝休息
    if (hh < 8 || hh >= 23.5) { if (g.group.visible) g.group.visible = false; return; }
    if (!g.group.visible) g.group.visible = true;
    g.pathT = (g.pathT + dt * 4.2 / g.pathLen) % 1;
    const p = g.curve.getPointAt(g.pathT);
    const tan = g.curve.getTangentAt(g.pathT);
    g.group.position.set(p.x, 0.1, p.z);
    g.group.rotation.y = Math.atan2(tan.x, tan.z);
    g.phase += dt * 2.6;
    const s = Math.sin(g.phase);
    g.legL.rotation.x = s * 0.5;
    g.legR.rotation.x = -s * 0.5;
    g.armL.rotation.x = -s * 0.4;
    g.armR.rotation.x = s * 0.4;
    g.body.position.y = Math.abs(Math.sin(g.phase * 2)) * 0.7;
    g.body.rotation.z = s * 0.028;                                   // v39：躯干随步伐微晃
    g.tail.rotation.y = Math.sin(g.phase * 0.55) * 0.32;
    g.tail.rotation.x = Math.sin(g.phase * 0.8) * 0.12;
    if (g.tailSegs) g.tailSegs.forEach(function (sg, i) {            // v39：尾逐节波浪
      sg.rotation.y = Math.sin(g.phase * 0.55 - i * 0.55) * 0.075;
    });
    const roar = Math.pow(Math.max(0, Math.sin(g.phase * 0.21 + 1.2)), 6);   // v39 咆哮脉冲
    if (g.jaw) g.jaw.rotation.x = 0.06 + roar * 0.42;
    if (g.flame) {                                                   // v43：咆哮喷火（与张口同步，火焰随吼声强度伸缩）
      const firing = roar > 0.45;
      g.flame.visible = firing;
      if (firing) {
        const fl = 0.55 + roar * 0.75 + Math.sin(g.phase * 39) * 0.07;
        g.flame.scale.set(0.75 + roar * 0.45, 0.75 + roar * 0.45, fl);
        g.flameLight.intensity = 300 * roar * (0.85 + Math.sin(g.phase * 47) * 0.15);
        g.sparks.forEach(function (sp, i) {
          const u = (g.phase * 3.1 + i * 0.618) % 1;
          sp.position.set(Math.sin(i * 12.9) * 0.34 * (1 - u), -0.1 + Math.cos(i * 7.7) * 0.3 * (1 - u), 1.2 + u * 6.4);
          const sc = 0.16 * (1 - u) + 0.05; sp.scale.set(sc, sc, sc * 2.2);
        });
      } else g.flameLight.intensity = 0;
    }
    g.head.rotation.y = Math.sin(g.phase * 0.35) * 0.22;
    g.head.rotation.x = Math.sin(g.phase * 0.9) * 0.06;
  }

  /* ---- v43 火箭发射循环：待命 → 点火升空 → 高空离场 → 返航减速着陆 ---- */
  function updateRocket(dt) {
    const r = rocket;
    if (!r) return;
    r.t += dt;
    const flick = 0.85 + Math.sin(r.t * 43) * 0.15;
    if (r.state === 'idle') {
      r.flame.visible = false; r.light.intensity = 0;
      r.smoke.forEach(function (sm) {
        if (sm.visible) {
          sm.material.opacity = Math.max(0, sm.material.opacity - dt * 0.04);
          if (sm.material.opacity <= 0) sm.visible = false;
        }
      });
      if (r.t > 70) { r.state = 'launch'; r.t = 0; r.smoke.forEach(function (sm) { sm.visible = true; }); }
    } else if (r.state === 'launch') {
      const t = r.t;
      const rise = 3.1 * t * t;
      r.grp.position.y = r.baseY + rise;
      r.flame.visible = true;
      const fs = Math.min(1, t / 0.7) * (0.85 + rise / 320) * flick;
      r.flame.scale.set(fs, fs, fs);
      r.light.intensity = 520 * flick;
      const u = Math.min(t / 6, 1);
      r.smoke.forEach(function (sm, i) {
        const aa = i / 9 * Math.PI * 2;
        const rad = 3.4 + u * 13;
        sm.position.set(Math.cos(aa) * rad, 0.8 + u * 1.6, Math.sin(aa) * rad);
        const sc = 1.6 + u * 7.0;
        sm.scale.set(sc, sc * 0.62, sc);
      });
      r.smoke[0].material.opacity = 0.45 * Math.min(1, t * 2) * (1 - u * 0.75);   // v44 烟团加大
      if (rise > 300) { r.state = 'away'; r.t = 0; r.grp.visible = false; r.flame.visible = false; r.light.intensity = 0; }
    } else if (r.state === 'away') {
      if (r.t > 16) { r.state = 'return'; r.t = 0; r.grp.visible = true; }
    } else if (r.state === 'return') {
      const t = r.t, T = 13;
      const k = Math.max(0, 1 - t / T);
      r.grp.position.y = r.baseY + 298 * k * k;
      r.flame.visible = true;
      const flare = t > 10.5 ? (t - 10.5) / (T - 10.5) * 0.5 : 0;
      const fs = (0.5 + flare) * flick;
      r.flame.scale.set(fs, fs, fs);
      r.light.intensity = 340 * flick * (0.4 + 0.6 * k + flare);
      if (t > 10.8) {
        const u2 = Math.min((t - 10.8) / (T - 10.8), 1);
        r.smoke.forEach(function (sm, i) {
          sm.visible = true;
          const aa = i / 9 * Math.PI * 2;
          const rad = 3.4 + u2 * 6;
          sm.position.set(Math.cos(aa) * rad, 0.8 + u2 * 0.8, Math.sin(aa) * rad);
          const sc = 1.6 + u2 * 2.6;
          sm.scale.set(sc, sc * 0.62, sc);
        });
        r.smoke[0].material.opacity = 0.30 * u2;
      }
      if (t >= T) { r.state = 'idle'; r.t = 0; r.grp.position.y = r.baseY; r.flame.visible = false; r.light.intensity = 0; }
    }
  }

  /* ---- v43 湾流起降循环：停机坪滑出 → 跑道加速起飞 → 绕场一周 → 进近降落 → 滑回 ---- */
  function updateJet(dt) {
    const J = jetAnim;
    if (!J) return;
    const g = J.grp;
    if (J.mode === 'wait') {
      J.wait -= dt;
      let dh0 = 0.62 - g.rotation.y;
      while (dh0 > Math.PI) dh0 -= Math.PI * 2;
      while (dh0 < -Math.PI) dh0 += Math.PI * 2;
      g.rotation.y += dh0 * Math.min(1, dt * 2);
      g.rotation.x *= 0.85; g.rotation.z *= 0.85;
      if (J.wait <= 0) { J.mode = 'go'; J.leg = 0; }
      return;
    }
    const L = J.legs[J.leg];
    const dx = L.x - g.position.x, dz = L.z - g.position.z;
    const dist = Math.hypot(dx, dz);
    const want = Math.atan2(dx, dz);
    let dh = want - g.rotation.y;
    while (dh > Math.PI) dh -= Math.PI * 2;
    while (dh < -Math.PI) dh += Math.PI * 2;
    const airborne = g.position.y > 2;
    const turnRate = airborne ? 0.5 : 1.05;
    const turn = Math.max(-turnRate * dt, Math.min(turnRate * dt, dh));
    g.rotation.y += turn;
    const accel = J.speed < L.v ? (airborne ? 3.2 : 6.5) : 10;
    J.speed += Math.max(-accel * dt, Math.min(accel * dt, L.v - J.speed));
    const sp = J.speed;
    g.position.x += Math.sin(g.rotation.y) * sp * dt;
    g.position.z += Math.cos(g.rotation.y) * sp * dt;
    const dyT = L.y - g.position.y;
    const yStep = Math.max(-7.5 * dt, Math.min((sp < 20 ? 3.2 : 10) * dt, dyT));
    g.position.y += yStep;
    const vyr = dt > 0 ? yStep / dt : 0;
    const pitchT = Math.max(-0.26, Math.min(0.20, -vyr * 0.028));
    g.rotation.x += (pitchT - g.rotation.x) * Math.min(1, dt * 3);
    const rollT = Math.max(-0.5, Math.min(0.5, -turn / Math.max(dt, 0.001) * sp * 0.011));
    g.rotation.z += (rollT - g.rotation.z) * Math.min(1, dt * 2.5);
    if (dist < Math.max(7, sp * 0.45) && Math.abs(dyT) < 7) {
      J.leg++;
      if (J.leg >= J.legs.length) { J.mode = 'wait'; J.wait = 26; J.speed = 0; }
    }
  }

  /* ================================================================
   * 模块 2：大楼核心骨架（FLOORS 矩阵循环）
   * ================================================================ */
  /* ================= 环形版基础设施 ================= */
  function P2(r, aDeg) { const a = aDeg * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; }
  function tanRot(a) { return -a - Math.PI / 2; }
  function wrapA(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
  function angDist(d1, d2) { let d = Math.abs(d1 - d2) % 360; return d > 180 ? 360 - d : d; }

  // 环带单人工位：桌子沿切向摆，椅子按世界坐标登记（face=+1 椅在内侧，-1 在外侧）
  function ringDesk(r, a, y, deskMat, chairMat, face) {
    const x = r * Math.cos(a), z = r * Math.sin(a);
    const g = grp();
    g.position.set(x, y, z);
    g.rotation.y = tanRot(a);
    box(1.8, 0.12, 1.5, deskMat, 0, 1.06, 0, g);
    box(0.1, 0.95, 1.3, MAT.metal, -0.85, 0.55, 0, g);
    box(0.1, 0.95, 1.3, MAT.metal, 0.85, 0.55, 0, g);
    box(1.0, 0.6, 0.06, MAT.dark, 0, 1.55, -face * 0.5, g);
    box(0.86, 0.48, 0.03, MAT.screen, 0, 1.57, -face * 0.46, g);
    const co = face * 1.5;
    createOfficeChair(x - Math.cos(a) * co, y, z - Math.sin(a) * co, chairMat,
      tanRot(a) + (face < 0 ? 0 : Math.PI));
  }

  // 整层环带工位田：内外两排，避开电梯（270°）与滑梯（225°）扇区
  function ringPods(y, chairFor) {
    for (let deg = 0; deg < 360; deg += 12) {
      if (angDist(deg, 270) < 15 || angDist(deg, 225) < 15) continue;
      const a = deg * Math.PI / 180;
      ringDesk(35.3, a, y, MAT.deskGray, chairFor(deg), 1);
      ringDesk(40.7, a + 0.05, y, MAT.deskGray, chairFor(deg), -1);
    }
  }

  function createBuildingCore() {
    // 环形楼板（Apple Park 式圆环）：外径 88 / 内径 64，带电梯井与滑梯井洞口
    function ringShape(withHoles, withSlides, withClub) {   // v25：withClub=6F 天台板专用（换 Club 梯井洞）
      const sh = new THREE.Shape();
      sh.absarc(0, 0, 44, 0, Math.PI * 2, false);
      const hole = new THREE.Path();
      hole.absarc(0, 0, 32, 0, Math.PI * 2, true);
      sh.holes.push(hole);
      if (withHoles) {
        if (withClub) {   // v25：天台板不开北梯洞，改开 Club 梯（340°）井洞：世界 (35.7,-13.0) → 形状 y 取反
          const ch = new THREE.Path();
          ch.moveTo(33.4, 10.7); ch.lineTo(38.0, 10.7); ch.lineTo(38.0, 15.3); ch.lineTo(33.4, 15.3); ch.closePath();
          sh.holes.push(ch);
        } else {
          const eh = new THREE.Path();   // 电梯井洞：世界 (0,-38) → 形状坐标 y 取反
          eh.moveTo(-2.3, 35.7); eh.lineTo(2.3, 35.7); eh.lineTo(2.3, 40.3); eh.lineTo(-2.3, 40.3); eh.closePath();
          sh.holes.push(eh);
        }
        if (withSlides) {   // v15：6F 天台板不调用（滑梯只到 5F，天台无孔）
          const sl = new THREE.Path();   // 滑梯洞：世界 (-26.9,-26.9) → 形状 (-26.9, 26.9)
          sl.absarc(-26.9, 26.9, 3.6, 0, Math.PI * 2, true);
          sh.holes.push(sl);
          const slA = new THREE.Path();   // v7 滑梯洞：世界 (26.9,26.9) → 形状 (26.9,-26.9)
          slA.absarc(26.9, -26.9, 3.6, 0, Math.PI * 2, true);
          sh.holes.push(slA);
          const slB = new THREE.Path();   // v7 滑梯洞：世界 (-26.9,26.9) → 形状 (-26.9,-26.9)
          slB.absarc(-26.9, -26.9, 3.6, 0, Math.PI * 2, true);
          sh.holes.push(slB);
        }
      }
      return sh;
    }
    const gnd = new THREE.Mesh(new THREE.ShapeGeometry(ringShape(false), 48), MAT.concrete);
    gnd.geometry.rotateX(-Math.PI / 2);
    gnd.position.y = 0.04;
    gnd.receiveShadow = true;
    scene.add(gnd);
    for (let f = 1; f <= 5; f++) {
      let slabShape = ringShape(true, f < 5, f === 5);   // v15：顶层不开滑梯洞；v25：顶层改 Club 梯井洞
      if (f === 1) {
        // v6 大堂挑高：2F 楼板抽掉南側大堂扇区（世界角 58°..122°；形状坐标 y 取反 → -122°..-58°）
        slabShape = new THREE.Shape();
        const sa0 = -106 * Math.PI / 180, sa1 = -74 * Math.PI / 180;
        slabShape.absarc(0, 0, 44, sa1, sa0 + Math.PI * 2, false);
        slabShape.lineTo(32 * Math.cos(sa0 + Math.PI * 2), 32 * Math.sin(sa0 + Math.PI * 2));
        slabShape.absarc(0, 0, 32, sa0 + Math.PI * 2, sa1, true);
        slabShape.closePath();
        const eh6 = new THREE.Path();
        eh6.moveTo(-2.3, 35.7); eh6.lineTo(2.3, 35.7); eh6.lineTo(2.3, 40.3); eh6.lineTo(-2.3, 40.3); eh6.closePath();
        slabShape.holes.push(eh6);
        const sl6 = new THREE.Path();
        sl6.absarc(-26.9, 26.9, 3.6, 0, Math.PI * 2, true);
        slabShape.holes.push(sl6);
        const sl7 = new THREE.Path();
        sl7.absarc(26.9, -26.9, 3.6, 0, Math.PI * 2, true);
        slabShape.holes.push(sl7);
        const sl8 = new THREE.Path();
        sl8.absarc(-26.9, -26.9, 3.6, 0, Math.PI * 2, true);
        slabShape.holes.push(sl8);
      }
      const geo = new THREE.ExtrudeGeometry(slabShape, { depth: SLAB, bevelEnabled: false, curveSegments: 72 });
      geo.rotateX(-Math.PI / 2);
      const slab = new THREE.Mesh(geo, MAT.concrete);
      slab.position.y = floorY(f + 1) - SLAB;
      slab.receiveShadow = true;
      scene.add(slab);
    }
    // 白色出挑楼板边：每层内外双环腰线
    const fasciaMat = new THREE.MeshStandardMaterial({ color: 0xf4f6f9, metalness: 0.2, roughness: 0.35 });
    for (let f = 2; f <= 6; f++) {
      const fo = new THREE.Mesh(new THREE.TorusGeometry(44.14, 0.15, 8, 108), fasciaMat);
      fo.geometry.rotateX(Math.PI / 2);
      fo.position.y = floorY(f) - 0.12;
      scene.add(fo);
      const fi = new THREE.Mesh(new THREE.TorusGeometry(31.86, 0.15, 8, 108), fasciaMat);
      fi.geometry.rotateX(Math.PI / 2);
      fi.position.y = floorY(f) - 0.12;
      scene.add(fi);
    }
    // 双层玻璃幕墙（外环略加重勾轮廓），统一 4.6m 层高
    const ringGlass = MAT.glass.clone();   // v15：学大堂圆筒（elevatorGlass 青色调）——淡青色才看得出是玻璃幕墙
    ringGlass.color = new THREE.Color(0xbfe3f2);   // 蓝白色调
    ringGlass.transmission = 0.95;
    ringGlass.opacity = 0.3;   // v15 修订（Mike 14:43 定）：透明度 70%
    const ringGlassIn = ringGlass.clone();
    for (let f = 1; f <= 5; f++) {
      const fh = FLOOR_H;
      const ph = fh - 0.55;
      const yc = floorY(f) + fh / 2;
      const outer = new THREE.Mesh(new THREE.CylinderGeometry(44.03, 44.03, ph, 108, 1, true), ringGlass);
      outer.position.set(0, yc, 0);
      scene.add(outer);
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(31.97, 31.97, ph, 108, 1, true), ringGlassIn);
      inner.position.set(0, yc, 0);
      scene.add(inner);
    }
    // Apple Park 式白色竖向遮阳鳍
    const finMat = new THREE.MeshStandardMaterial({ color: 0xf7f9fc, metalness: 0.15, roughness: 0.4 });
    const finH = floorY(6) - 0.4;
    for (let d = 0; d < 360; d += 9) {   // v8：立柱间距 6°→9°，数量减少 1/3
      if (d >= 72 && d <= 108) continue;   // v7 大堂圆筒扇区（无鳍）
      const a = d * Math.PI / 180;
      const fin = box(0.16, finH, 0.85, finMat, 44.45 * Math.cos(a), finH / 2 + 0.2, 44.45 * Math.sin(a));
      fin.rotation.y = tanRot(a);

    // 电梯井（北侧环带）+ 厅门 + 轿厢（v25：北梯只到 5F——井顶封在 6F 楼板面、无 6F 厅门；上 6F 改走 Club 梯）
    box(4.2, floorY(6), 4.2, MAT.elevatorGlass, 0, floorY(6) / 2, -38);
    box(4.6, 0.4, 4.6, MAT.metal, 0, floorY(6) - 0.1, -38);
    for (let f = 1; f <= 5; f++) {
      box(3.6, 4.4, 0.12, MAT.silver, 0, floorY(f) + 2.2, -35.85);
    }
    const carGroup = grp();
    elevatorCar = box(2.8, 4.0, 2.8, MAT.silver, 0, 0, 0, carGroup);
    elevatorCar.castShadow = false;
    elevator.doorL = box(1.5, 4.2, 0.12, MAT.silverDark, -0.75, 0.1, 1.45, carGroup);
    elevator.doorR = box(1.5, 4.2, 0.12, MAT.silverDark, 0.75, 0.1, 1.45, carGroup);
    box(2.2, 3.2, 0.06, MAT.starLight, 0, 0.2, -1.35, carGroup);
    carGroup.position.set(0, 2.0, -38);
    elevator.group = carGroup;
    const carLight = new THREE.PointLight(0xdfe8ff, 26, 12, 2);
    carLight.position.set(0, 0.9, 0);
    carGroup.add(carLight);
    buildSpiralSlide();
    // 透明透镜壳（圆柱，只包到 5F 顶）
    const lensMat = new THREE.MeshPhysicalMaterial({
      color: 0xe3efff, metalness: 0, roughness: 0.02, transmission: 0.9,
      transparent: true, opacity: 0.07, thickness: 0.1, ior: 1.5,
      side: THREE.DoubleSide, clearcoat: 1, clearcoatRoughness: 0.04,
      depthWrite: false
    });
    const lensH = floorY(6) + 0.3;
    lensMesh = new THREE.Mesh(new THREE.CylinderGeometry(44.35, 44.35, lensH, 108, 1, true), lensMat);
    lensMesh.name = 'building-lens';
    lensMesh.position.set(0, lensH / 2, 0);
    lensMesh.castShadow = false;
    lensMesh.receiveShadow = false;
    scene.add(lensMesh);
  }



  /* 旋转滑梯：围绕中央立柱的螺旋管廊，2F~6F 每层设入口平台，1F 出口，
   * 特工可从所在层入口迈入，沿螺旋管一路滑到 1F（mode: 'sliding'） */
  function buildSpiralSlide() {
    const CX = -26.9, CZ = -26.9, R = 2.3, TURNS = 2.8;
    const topY = floorY(6) - 0.9;   // v8：滑梯只到 5F，终口贴 6F 楼板底（天花板）
    const botY = 1.35;              // 1F 出口高度
    const pts = [];
    const N = 180;
    for (let i = 0; i <= N; i++) {
      const k = i / N, ang = k * TURNS * Math.PI * 2;
      pts.push(new THREE.Vector3(CX + Math.cos(ang) * R, topY + (botY - topY) * k, CZ + Math.sin(ang) * R));
    }
    slide.curve = new THREE.CatmullRomCurve3(pts);
    slide.tube = new THREE.Mesh(new THREE.TubeGeometry(slide.curve, 240, 0.62, 14, false), MAT.slide);
    slide.tube.name = 'spiral-slide';
    slide.tube.castShadow = false;
    scene.add(slide.tube);
    // 2F~6F 入口平台 + 护栏（平台贴管口外侧，每层都能迈入）
    for (const f of [2, 3, 4, 5]) {
      const k = (topY - floorY(f)) / (topY - botY);
      const ang = k * TURNS * Math.PI * 2;
      const tx = CX + Math.cos(ang) * R, tz = CZ + Math.sin(ang) * R;      // 管口（滑行起点）
      const ox = Math.cos(ang), oz = Math.sin(ang);                          // 外向方向
      const px = CX + ox * (R + 1.45), pz = CZ + oz * (R + 1.45);            // 平台中心
      slide.entries[f] = { x: tx, z: tz, t: k };
      box(2.9, 0.14, 2.9, MAT.deck, px, floorY(f) + 0.07, pz);               // 入口平台
      box(2.7, 0.1, 0.14, MAT.metal, px + ox * 1.25, floorY(f) + 0.72, pz + oz * 1.25); // 护栏横杆
      cyl(0.05, 0.05, 0.75, 6, MAT.metal, px + ox * 1.25 - 1.25, floorY(f) + 0.4, pz + oz * 1.25);
      cyl(0.05, 0.05, 0.75, 6, MAT.metal, px + ox * 1.25 + 1.25, floorY(f) + 0.4, pz + oz * 1.25);
      cyl(0.05, 0.05, 0.75, 6, MAT.metal, px - ox * 1.25, floorY(f) + 0.4, pz - oz * 1.25);
    }
    // 1F 出口平台（管口落地处）
    const eAng = TURNS * Math.PI * 2;
    const ex = CX + Math.cos(eAng) * (R + 1.45), ez = CZ + Math.sin(eAng) * (R + 1.45);
    slide.exit = { x: ex, z: ez };
    box(3.2, 0.14, 3.2, MAT.deck, ex, 0.07, ez);
    box(2.9, 0.1, 0.14, MAT.metal, ex, 0.72, ez - 1.35);
    cyl(0.05, 0.05, 0.75, 6, MAT.metal, ex - 1.3, 0.4, ez - 1.35);
    cyl(0.05, 0.05, 0.75, 6, MAT.metal, ex + 1.3, 0.4, ez - 1.35);
    // 中央支撑立柱（原楼梯中柱保留加粗）
    const slideColTop = floorY(6) - 0.1;
    cyl(0.16, 0.16, slideColTop - 0.4, 8, MAT.metal, CX, (slideColTop + 0.4) / 2, CZ);
  }

  function createGlassRoom(x0, x1, z0, z1, y, doorSide) {
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const w = x1 - x0, d = z1 - z0, wh = 2.4;
    const g = grp();
    box(w - 0.2, 0.04, d - 0.2, MAT.officeCarpet, cx, y + 0.03, cz, g);
    box(0.1, wh, d, MAT.glass, x0, y + wh / 2, cz, g);       // 后墙
    box(w, 0.1, wh, MAT.glass, cx, y + wh / 2, z0, g);       // 侧墙
    box(w, 0.1, wh, MAT.glass, cx, y + wh / 2, z1, g);       // 侧墙
    const seg = (d - 1.8) / 2;                                 // 门墙分两段留门洞
    const dx = doorSide === 'right' ? x1 : x0;
    box(0.1, wh, seg, MAT.glass, dx, y + wh / 2, z0 + seg / 2, g);
    box(0.1, wh, seg, MAT.glass, dx, y + wh / 2, z1 - seg / 2, g);
    box(0.3, wh + 0.15, 0.3, MAT.metal, dx, y + wh / 2, cz);  // 门框
    return g;
  }

  /* ---- v4 名牌：全员统一深蓝金边；五位总 + 主席带皇冠（Mike 大皇冠） ---- */
  function crownOf(name) {
    if (name === 'Mike') return 2;
    return ['Yuna', 'Crystal', 'Elon', 'Jennie', 'Fiona'].indexOf(name) >= 0 ? 1 : 0;
  }
  function drawCrown(g, cx, cy, sc) {
    g.save();
    g.translate(cx, cy);
    g.scale(sc, sc);
    g.beginPath();
    g.moveTo(-20, 9); g.lineTo(-20, -8); g.lineTo(-10, 1); g.lineTo(0, -12);
    g.lineTo(10, 1); g.lineTo(20, -8); g.lineTo(20, 9); g.closePath();
    g.fillStyle = '#ffd76b';
    g.fill();
    g.strokeStyle = '#a87e1c'; g.lineWidth = 1.6; g.stroke();
    g.fillStyle = '#fff3c4';
    [[-20, -11], [0, -15], [20, -11]].forEach(function (d) {
      g.beginPath(); g.arc(d[0], d[1], 2.6, 0, Math.PI * 2); g.fill();
    });
    g.restore();
  }
  function unifiedNameTex(text) {
    const lv = crownOf(text);
    return canvasTexWH(256, 80, function (g, w, h) {
      g.fillStyle = '#101826'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#d4af37'; g.lineWidth = 4; g.strokeRect(3, 3, w - 6, h - 6);
      g.textAlign = 'center';
      g.fillStyle = '#f7d984';
      if (lv > 0) {
        drawCrown(g, w / 2, 21, lv === 2 ? 1.25 : 0.95);
        g.font = 'bold 29px Georgia, serif';
        g.fillText(text, w / 2, 68);
      } else {
        g.font = 'bold 33px Georgia, serif';
        g.fillText(text, w / 2, 53);
      }
    });
  }
  function crownPlateTex(text) {
    const lv = crownOf(text);
    return canvasTexWH(256, 64, function (g, w, h) {
      g.clearRect(0, 0, w, h);
      g.shadowColor = 'rgba(15, 40, 70, 0.22)'; g.shadowBlur = 5; g.shadowOffsetY = 2;
      g.fillStyle = 'rgba(252, 253, 255, 0.97)';
      g.beginPath(); g.roundRect(3, 3, w - 6, h - 6, 14); g.fill();
      g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
      g.strokeStyle = 'rgba(160, 130, 40, 0.55)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect(3, 3, w - 6, h - 6, 14); g.stroke();
      g.fillStyle = '#d4af37';
      g.beginPath(); g.roundRect(12, 15, 7, h - 30, 3.5); g.fill();
      drawCrown(g, 38, 30, lv === 2 ? 1.15 : 0.85);
      g.textAlign = 'left';
      g.fillStyle = '#16324f';
      let fs = 30;
      g.font = 'bold ' + fs + 'px "Segoe UI", Arial, sans-serif';

      g.fillText(text, 68, 43);
    });
  }

    return crownOf(name) > 0 ? crownPlateTex(name) : nameplateTex(name);
  }

  function buildSlideTower(cx, cz, colorHex, phase) {
    const mat = new THREE.MeshPhysicalMaterial({ color: colorHex, metalness: 0.05, roughness: 0.3, clearcoat: 0.5, transparent: true, opacity: 0.95 });
    const R = 2.3, TURNS = 2.8, topY = floorY(6) + 1.6, botY = 1.35, pts = [];
    for (let i = 0; i <= 180; i++) {
      const k = i / 180, ang = phase + k * TURNS * Math.PI * 2;
      pts.push(new THREE.Vector3(cx + Math.cos(ang) * R, topY + (botY - topY) * k, cz + Math.sin(ang) * R));
    }
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.62, 14, false), mat);
    tube.castShadow = false;
    scene.add(tube);
    cyl(0.16, 0.16, topY + 0.4, 8, MAT.metal, cx, (topY + 0.4) / 2, cz);
    const ea = phase + TURNS * Math.PI * 2;
    box(3.2, 0.14, 3.2, MAT.deck, cx + Math.cos(ea) * (R + 1.45), 0.07, cz + Math.sin(ea) * (R + 1.45));
    box(2.9, 0.14, 2.9, MAT.deck, cx + Math.cos(phase) * (R + 1.45), floorY(6) + 0.07, cz + Math.sin(phase) * (R + 1.45));
  }

  function createV6Shell() {
    // 电梯 ×3：大堂梯 100°（圆筒内，只到 5F）+ Club 梯 340°（通 6F 天台）+ 西南外贴梯 160°（只到 5F）
    buildExtraElevator(100, 38);
    buildExtraElevator(340, 38, true);
    buildExtraElevator(160, 45.5);
    // 旋转滑梯 ×2（楼内，与原版同款同透明度）：东南 45° + 西南 135°
    buildInnerSlide(26.9, 26.9, 1.6);
    buildInnerSlide(-26.9, 26.9, -2.6);
    // ===== 大堂椭圆圆筒（1F~2F 两层高）：外 C 凸出 + 内 C 在楼内，合成一个圆筒，包裹大堂电梯 =====
    const drumH = floorY(3);
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, drumH, 64, 1, true), MAT.elevatorGlass);
    drum.scale.set(15 / 11, 1, 9.5 / 11);
    drum.position.set(0, drumH / 2, 42);
    scene.add(drum);
    const drumFloor = new THREE.Mesh(new THREE.CircleGeometry(11, 48), MAT.marble);
    drumFloor.geometry.rotateX(-Math.PI / 2);
    drumFloor.scale.set(15 / 11, 1, 9.5 / 11);
    drumFloor.position.set(0, 0.06, 42);
    scene.add(drumFloor);
    // v8：平顶只盖圆筒凸出楼外（r≥44.3）的部分，不压 3F 地板：
    // 边界 = 椭圆前弧（自原点射线求交）+ 外墙圆弧，采样成多边形
    const roofShape = new THREE.Shape();
    const ellPts = [];
    for (let fd = 40; fd <= 140; fd += 1.5) {
      const fr = fd * Math.PI / 180, cf = Math.cos(fr), sf = Math.sin(fr);
      const A = cf * cf / 225 + sf * sf / 90.25;
      const B = -84 * sf / 90.25, C = 1764 / 90.25 - 1;
      const disc = B * B - 4 * A * C;
      if (disc < 0) continue;
      const sd = (-B + Math.sqrt(disc)) / (2 * A);
      if (sd >= 44.3) ellPts.push([sd * cf, sd * sf, fd]);
    }
    if (ellPts.length > 2) {
      const f0 = ellPts[0][2], f1 = ellPts[ellPts.length - 1][2];
      roofShape.moveTo(44.3 * Math.cos(f0 * Math.PI / 180), -44.3 * Math.sin(f0 * Math.PI / 180));
      for (let fd = f0 + 1.5; fd < f1; fd += 1.5) {
        const fr = fd * Math.PI / 180;
        roofShape.lineTo(44.3 * Math.cos(fr), -44.3 * Math.sin(fr));
      }
      roofShape.lineTo(44.3 * Math.cos(f1 * Math.PI / 180), -44.3 * Math.sin(f1 * Math.PI / 180));
      for (let i = ellPts.length - 1; i >= 0; i--) roofShape.lineTo(ellPts[i][0], -ellPts[i][1]);
      roofShape.closePath();
      const roofGeo = new THREE.ShapeGeometry(roofShape, 4);
      roofGeo.rotateX(-Math.PI / 2);
      const drumRoof = new THREE.Mesh(roofGeo,
        new THREE.MeshStandardMaterial({ color: 0xf4f7fa, roughness: 0.5, side: THREE.DoubleSide }));
      drumRoof.position.set(0, drumH + 0.03, 0);
      scene.add(drumRoof);
      const rimPts = ellPts.map(function (p) { return new THREE.Vector3(p[0], drumH + 0.05, p[1]); });
      const rim = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPts), 40, 0.13, 8), MAT.white);
      scene.add(rim);
    }
    // 凸出平顶上的大招牌（朝南，接待台后墙原招牌保留不动）
    box(0.18, 1.6, 0.18, MAT.metal, -3.4, drumH + 0.8, 47.5);
    box(0.18, 1.6, 0.18, MAT.metal, 3.4, drumH + 0.8, 47.5);
    box(11.6, 2.3, 0.18, MAT.white, 0, drumH + 1.95, 47.5);
    const roofSign = new THREE.Mesh(new THREE.PlaneGeometry(10.8, 2.03),
      new THREE.MeshBasicMaterial({ map: zoneTitleTex('Dopplers.'), toneMapped: false, transparent: true }));
    roofSign.position.set(0, drumH + 1.95, 47.62);
    scene.add(roofSign);
    // 大堂挑高（缩小一半：74°..106°）：2F 临空玻璃栏杆 + 切面白封边梁
    const y2 = floorY(2);
    [74, 106].forEach(function (da) {
      const a = da * Math.PI / 180;
      const p = P2(38, da);
      const w = box(0.08, 1.05, 11.6, MAT.glass, p[0], y2 + 0.55, p[1]);
      w.rotation.y = Math.atan2(Math.cos(a), Math.sin(a));
      const hr = box(0.14, 0.07, 11.6, MAT.metal, p[0], y2 + 1.12, p[1]);
      hr.rotation.y = Math.atan2(Math.cos(a), Math.sin(a));
      const beam = box(0.3, 0.34, 11.8, MAT.white, p[0], y2 - 0.16, p[1]);
      beam.rotation.y = Math.atan2(Math.cos(a), Math.sin(a));
    });
    const arcRail = new THREE.Mesh(new THREE.CylinderGeometry(32.06, 32.06, 1.0, 32, 1, true, -0.28, 0.56), MAT.glass);
    arcRail.position.set(0, y2 + 0.5, 0);
    scene.add(arcRail);
  }

    tube.castShadow = false;

      const ang = phase + k * TURNS * Math.PI * 2;

      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 === 0 ? 27 : 11;
        const aa = -Math.PI / 2 + i * Math.PI / 5;
        const px = w / 2 + rr * Math.cos(aa), py = 44 + rr * Math.sin(aa);
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath(); g.fill();
      g.textAlign = 'center';
      g.shadowColor = 'rgba(10, 25, 50, 0.38)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
      g.fillStyle = 'rgba(255, 255, 255, 0.95)';

  /* ================= v32 休闲出行：健身房 / 街机室使用位 =================
     位置由器材几何反推（本地 +z 朝圆心，lz 偏移 ≡ 半径 r-lz）：
     1F 跑步机（东弧 10/14/18°，屏在 +z 侧，人面朝屏=朝圆心）；
     2F 跑步机（西北弧 234..254°，控制台在 -z 侧，人面朝外）；
     2F 街机（西弧 192/198/204°，站在柜前朝外）；2F 台球桌两侧各一。 */
  const LEISURE_SPOTS = (function () {
    const out = [];
    function faceOut(a) { return Math.atan2(Math.cos(a), Math.sin(a)); }
    function faceIn(a) { return Math.atan2(-Math.cos(a), -Math.sin(a)); }
    [10, 14, 18].forEach(function (dg) {
      const a = dg * Math.PI / 180, p = P2(40.45, dg);
      out.push({ floor: 1, x: p[0], z: p[1], rotY: faceIn(a), kind: 'gym', by: null });
    });
    [234, 239, 244, 249, 254].forEach(function (dg) {
      const a = dg * Math.PI / 180, p = P2(41.5, dg);
      out.push({ floor: 2, x: p[0], z: p[1], rotY: faceOut(a), kind: 'gym', by: null });
    });
    [192, 198, 204].forEach(function (dg) {
      const a = dg * Math.PI / 180, p = P2(41.25, dg);
      out.push({ floor: 2, x: p[0], z: p[1], rotY: faceOut(a), kind: 'arcade', by: null });
    });
    (function () {
      const a = 182 * Math.PI / 180;
      const pIn = P2(35.45, 182), pOut = P2(37.55, 182);
      out.push({ floor: 2, x: pIn[0], z: pIn[1], rotY: faceOut(a), kind: 'arcade', by: null });
      out.push({ floor: 2, x: pOut[0], z: pOut[1], rotY: faceIn(a), kind: 'arcade', by: null });
    })();
    return out;
  })();

  // 员工起身决策时调用：命中则占位并设好模式（本层步行 / 跨层电梯），返回 true
  function tryLeisure(d) {
    if (d.isDirector || d.stay || d.wanderOnly || d.goingHome || d.leisure) return false;
    if (d.homeFloor === 5 || d.homeFloor === 6) return false;      // 与既有规矩一致：5F 常驻本层，6F 是 Club 层
    if (d.curFloor !== d.homeFloor) return false;
    d.leisureT = d.leisureT || 0;
    if (d.leisureT > 0) return false;                               // 刚活动完，冷却中
    const h = timeState.h;
    const lunch = h >= 12.5 && h < 13.5;
    const p = timeState.work ? 0.05 : (lunch ? 0.6 : 0.35);
    if (Math.random() >= p) return false;
    let active = 0;
    for (let j = 0; j < agentList.length; j++) if (agentList[j].userData.leisure) active++;
    if (active >= 9) return false;                                 // 同时最多 9 人在休闲
    const free = LEISURE_SPOTS.filter(function (s) { return !s.by; });
    if (!free.length) return false;
    const same = free.filter(function (s) { return s.floor === d.curFloor; });
    const pool = same.length ? same : free;                        // 就近优先本层
    const spot = pool[Math.floor(Math.random() * pool.length)];
    spot.by = d; d.leisure = spot;
    if (spot.floor === d.curFloor) d.mode = 'toLeisure';
    else { d.mode = 'toElevator'; d.goingHome = false; setLiftTarget(d); }
    return true;
  }

  function updateExtras(dt, t) {
    const nf = nightFactor(timeState.h);
    for (let i = 0; i < extras.heads.length; i++) {

        extras.ppt.material.map = extras.pptSlides[extras.pptIdx];
        extras.ppt.material.needsUpdate = true;
      }
    }

    for (let i = 0; i < extras.cones.length; i++) {
      const c = extras.cones[i];
      c.mesh.material.opacity = nf * 0.16;
      c.mesh.rotation.z = Math.sin(t * 0.6 + c.phase) * 0.16;
      c.mesh.rotation.x = Math.cos(t * 0.5 + c.phase) * 0.10;
    }
    if (extras.beam) extras.beam.material.opacity = nf * 0.13;
    if (extras.screenMat) extras.screenMat.color.setScalar(0.35 + 0.65 * nf);
    for (let i = 0; i < extras.floats.length; i++) {
      const f = extras.floats[i];
      f.obj.position.y = f.baseY + Math.sin(t * 1.25 + f.phase) * 0.05;
      f.obj.position.x = f.homeX + Math.sin(t * 0.13 + f.phase) * 0.55;
      f.obj.position.z = f.homeZ + Math.cos(t * 0.1 + f.phase) * 0.45;
      f.obj.rotation.y += dt * 0.15;
    }

    if (extras.heli) {
      const tau = t % 65;
      heliPosAt(tau, _hp1);
      extras.heli.position.copy(_hp1);
      heliPosAt(tau + 0.12, _hp2);
      const vx = _hp2.x - _hp1.x, vz = _hp2.z - _hp1.z;
      if (vx * vx + vz * vz > 1e-6) {
        const targetYaw = Math.atan2(-vz, vx);
        let dyy = targetYaw - extras.heliYawCur;
        dyy = Math.atan2(Math.sin(dyy), Math.cos(dyy));
        extras.heliYawCur += dyy * Math.min(1, dt * 2.2);
      }
      extras.heli.rotation.y = extras.heliYawCur;
      const flying = tau >= 8 && tau < 56;
      if (extras.heliRotor) extras.heliRotor.rotation.y += dt * (flying ? 22 : 3.5);
      if (extras.heliTail) extras.heliTail.rotation.z += dt * (flying ? 18 : 3);

        extras.heliBody.rotation.x = cruise ? 0.13 : 0;
        extras.heliBody.rotation.z = (tau >= 10 && tau < 17) ? 0.05 : ((tau >= 43 && tau < 54) ? -0.04 : 0);
      }

        if (cBtn) { cBtn.textContent = '◉ 中央镜头'; cBtn.style.background = ''; cBtn.style.color = ''; }
      }
      controls.minDistance = 8;
      controls.maxDistance = 750;
      const V = f === 8
        ? { p: [-248, 27, 82], t: [-300, 9, 20] }       // 发射台：东南侧斜望火箭
        : { p: [112, 34, 112], t: [240, 2, 23] };       // 机场：停机坪在近景、跑道向东展开
      camTween = {
        t: 0,
        from: camera.position.clone(),
        to: new THREE.Vector3(V.p[0], V.p[1], V.p[2]),
        tf: controls.target.clone(),
        tt: new THREE.Vector3(V.t[0], V.t[1], V.t[2])
      };
      controls.autoRotate = false;
      return;
    }
    if (centerMode) {
      if (f === 0) {
        centerCustom = false;   // 全景：回中庭轴线全景（退出轨道模式）
        camTween = {
          t: 0,
          from: camera.position.clone(),
          to: new THREE.Vector3(19.45, 13.5, 19.45),
          tf: controls.target.clone(),
          tt: new THREE.Vector3(0, 12.6, 0)
        };
      } else {
        // v19：切到该层、保持当前角度与半径，继续贴内圆玻璃环行看这一层的人
        centerCustom = true; cFloor = f;
        camTween = {
          t: 0,
          from: camera.position.clone(),
          to: new THREE.Vector3(cR * Math.cos(cTheta), floorY(f) + 1.7 + cYOff, cR * Math.sin(cTheta)),
          tf: controls.target.clone(),
          tt: new THREE.Vector3(38 * Math.cos(cTheta), floorY(f) + 1.2 + cYOff * 0.6, 38 * Math.sin(cTheta))
        };
      }
      controls.autoRotate = false;
      return;
    }
    controls.minDistance = 22;
    controls.maxDistance = 750;   // v36 外侧模式（原 260，场地已扩到约 700m 宽）
    const y = f === 0 ? 21 : floorY(f);
    const ty = f === 0 ? 21 : floorY(f) + 1.5;
    camTween = {
      t: 0,
      from: camera.position.clone(),
      to: new THREE.Vector3(54, y + 9, 62),
      tf: controls.target.clone(),
      tt: new THREE.Vector3(0, ty, 0)
    };
    controls.autoRotate = false;
  }

  /* ---------------- 24 小时时间系统 ---------------- */
  const SKY_KEYS = [
    { h: 0,    sky: 0x0a1128, sun: 0x9db4e0, si: 0.22, amb: 0.18, hemi: 0.30 },
    { h: 5,    sky: 0x1a2038, sun: 0x8fa0c8, si: 0.30, amb: 0.22, hemi: 0.35 },
    { h: 6.5,  sky: 0xf08a4b, sun: 0xff9a50, si: 0.95, amb: 0.36, hemi: 0.52 },
    { h: 8,    sky: 0x8ec9f2, sun: 0xfff1dc, si: 1.75, amb: 0.46, hemi: 0.62 },
    { h: 12,   sky: 0x74bdf2, sun: 0xfff6ea, si: 2.25, amb: 0.54, hemi: 0.70 },
    { h: 16,   sky: 0x84c2ef, sun: 0xfff1dc, si: 1.95, amb: 0.46, hemi: 0.62 },
    { h: 18.5, sky: 0xf2762e, sun: 0xff7a35, si: 1.05, amb: 0.36, hemi: 0.48 },
    { h: 20,   sky: 0x27335e, sun: 0x6a7bb0, si: 0.40, amb: 0.22, hemi: 0.35 },
    { h: 24,   sky: 0x0a1128, sun: 0x9db4e0, si: 0.22, amb: 0.18, hemi: 0.30 }
  ];
  const _cA = new THREE.Color(), _cB = new THREE.Color();
  function nightFactor(h) {
    if (h <= 4 || h >= 21) return 1;
    if (h < 6) return (6 - h) / 2;
    if (h > 19) return (h - 19) / 2;
    return 0;
  }
  function periodName(h) {
    if (h < 4.5) return '深夜';
    if (h < 6) return '黎明';
    if (h < 8) return '日出';
    if (h < 11) return '上午';
    if (h < 13) return '正午';
    if (h < 17) return '下午';
    if (h < 19) return '日落';
    if (h < 21) return '黄昏';
    return '夜晚';
  }
  // 工作时间：9:00-12:30 / 13:30-18:00（午休 12:30-13:30 不算）
  function isWorkHour(h) {
    return (h >= 9 && h < 12.5) || (h >= 13.5 && h < 18);
  }
  function updateDayNight(h) {
    let i = 0;
    while (i < SKY_KEYS.length - 2 && h >= SKY_KEYS[i + 1].h) i++;
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    const k = THREE.MathUtils.clamp((h - a.h) / (b.h - a.h), 0, 1);
    _cA.setHex(a.sky).lerp(_cB.setHex(b.sky), k);
    scene.background.copy(_cA);
    scene.fog.color.copy(_cA);
    if (sunLight) {
      sunLight.color.copy(_cA.setHex(a.sun).lerp(_cB.setHex(b.sun), k));
      sunLight.intensity = a.si + (b.si - a.si) * k;
      const ang = ((h - 6) / 12) * Math.PI;
      sunLight.position.set(Math.cos(ang) * 95, Math.max(Math.sin(ang), 0.1) * 115 + 10, 45);
    }
    if (ambientLight) ambientLight.intensity = a.amb + (b.amb - a.amb) * k;
    if (hemiLight) hemiLight.intensity = a.hemi + (b.hemi - a.hemi) * k;
    // 夜间：天际线窗户亮灯 + 路灯点亮
    const nf = nightFactor(h);
    for (let m = 0; m < skylineMats.length; m++) skylineMats[m].emissiveIntensity = 0.03 + nf * 1.25;
    MAT.lampHead.emissiveIntensity = 0.12 + nf * 1.7;
    // 圆月：沿太阳反向弧线升落，夜间渐显（白天隐去）
    if (moonSprite) {
      const ma = ((h - 6) / 12) * Math.PI + Math.PI;
      moonSprite.position.set(Math.cos(ma) * 250, Math.max(Math.sin(ma), 0.06) * 215 + 45, -140);
      moonSprite.material.opacity = nf * 0.95;
    }
    // 白云：白天浓、入夜转淡（夜间仍可见）
    for (let i = 0; i < cloudSprites.length; i++) cloudSprites[i].material.opacity = 0.92 - nf * 0.45;
  }

  /* ---------------- 电梯：开关门 + 运行 + 乘客上下 ---------------- */
  /* ---------------- 电梯：开关门 + 运行 + 乘客上下 ----------------
   * 状态机：closed(停靠) → opening → open(上下客) → closing →
   *         moving(轿厢运行) → 到站 → opening ...
   * arrived 仅表示"轿厢已到达目标层"，与门循环完全解耦；
   * 旧版把 arrived 残留带进下一循环，会跳过 closing/closed，
   * 导致门只开不关、轿厢卡死在一楼。 */
  /* v25：选梯——行程涉及 6F（人在 6F / 下班回 6F 工位）走 Club 梯（340°，入口 32.5,-11.8），其余走北梯（入口 0,-34.6） */
  function setLiftTarget(d) {
    if (d.curFloor === 6 || (d.goingHome && d.homeFloor === 6)) { d.tx = 32.5; d.tz = -11.8; d.atClub = true; }
    else { d.tx = 0; d.tz = -34.6; d.atClub = false; }
  }

  function updateElevator(dt) {
    elevator.timer -= dt;
    if (elevator.state === 'closed') {
      // 停靠计时到点 → 开门
      if (elevator.timer <= 0) { elevator.state = 'opening'; elevator.open = 0; }
    } else if (elevator.state === 'opening') {
      elevator.open = Math.min(1, elevator.open + dt / 0.9);
      if (elevator.open >= 1) { elevator.state = 'open'; elevator.timer = 2.4; }
    } else if (elevator.state === 'open') {
      if (elevator.timer <= 0) {
        // 到站下客：目的层 = 当前层的乘客先下
        for (let i = elevator.riders.length - 1; i >= 0; i--) {
          const r = elevator.riders[i];
          if (r.dest === elevator.curFloor) {
            const ag = r.agent, ud = ag.userData;
            ag.visible = true;
            ag.position.set(0, floorY(elevator.curFloor), -34.6);
            ud.curFloor = elevator.curFloor;
            ud.baseY = floorY(elevator.curFloor);
            ud.mode = 'exitWalk';
            if (ud.goingHome) {
              ud.tx = ud.cx; ud.tz = ud.cz;
              ud.afterExit = (ud.seatX !== undefined) ? 'toSeat' : 'wander';
            } else if (ud.leisure) {
              ud.tx = ud.leisure.x; ud.tz = ud.leisure.z;   // v32：下梯直奔器材位
              ud.afterExit = 'toLeisure';
            } else {
              // 总监拜访 5F：径直走到主席桌前寒暄停留；其他楼层稍作停留后乘电梯回本层
              if (elevator.curFloor === 5) { ud.tx = 35.9; ud.tz = 0; ud.returnT = 15 + Math.random() * 15; }
              else { ud.tx = 2.5; ud.tz = -33.5; ud.returnT = 6 + Math.random() * 10; }
              ud.afterExit = 'returnWait';
            }
            elevator.riders.splice(i, 1);
          }
        }
        elevator.state = 'closing';
      }
    } else if (elevator.state === 'closing') {
      elevator.open = Math.max(0, elevator.open - dt / 0.9);
      if (elevator.open <= 0) {
        // 关门后选下一站：有乘客优先送；否则优先去有人等梯的楼层；再否则概率空载巡逻
        let next = null;
        if (elevator.riders.length > 0) {
          next = elevator.riders[0].dest;
          for (let i = 0; i < elevator.riders.length; i++) {       // 前往 5F 拜会主席的总监优先送达
            if (elevator.riders[i].priority) { next = elevator.riders[i].dest; break; }
          }
        }
        else {
          const waiting = [];
          for (let i = 0; i < agentList.length; i++) {
            const ud = agentList[i].userData;
            if (ud.mode === 'waitDoor' && !ud.atClub && ud.curFloor !== elevator.atFloor) waiting.push(ud.curFloor);   // v25：Club 候梯者不惊动北梯
          }
          if (waiting.length > 0) next = waiting[Math.floor(Math.random() * waiting.length)];
          else if (Math.random() < 0.6) {
            next = 1 + Math.floor(Math.random() * 5);   // v25：北梯只到 5F，空载巡逻不上 6F
            if (next === elevator.atFloor) next = next === 5 ? 1 : next + 1;
          }
        }
        if (next !== null && next !== elevator.atFloor) {
          elevator.curFloor = next;
          elevator.targetY = floorY(next) + 2.0;
          elevator.arrived = false;
          elevator.state = 'moving';
          elevator.timer = 0;
        } else {
          // 原地停靠，稍后重新开门
          elevator.state = 'closed';
          elevator.timer = 2.5 + Math.random() * 2;
        }
      }
    }
    // 轿厢运行（仅 moving 期间有效）
    if (!elevator.arrived && elevator.targetY !== null) {
      const diff = elevator.targetY - elevator.y;
      if (Math.abs(diff) > 0.03) {
        elevator.y += Math.sign(diff) * Math.min(Math.abs(diff), elevator.speed * dt);
      } else {
        elevator.y = elevator.targetY;
        elevator.arrived = true;
        elevator.atFloor = elevator.curFloor;
        elevator.state = 'opening';
        elevator.open = 0;
      }
      if (elevator.group) elevator.group.position.y = elevator.y;
    }
    if (elevator.doorL) elevator.doorL.position.x = -0.75 - elevator.open * 1.35;
    if (elevator.doorR) elevator.doorR.position.x = 0.75 + elevator.open * 1.35;
  }

  /* ---------------- 特工随机工位动作 ----------------
   * 就坐：加权随机更换动作（双手打字/鼠标点击/举杯喝水/扶耳打电话/低头阅读/
   *       托腮沉思/举手挥手/伸懒腰/闲坐转头），每人独立计时 → 人人不同步；
   * 移动：双臂自然摆动。所有姿态用插值平滑过渡，换动作不跳变。 */
  /* 环形版专用：沿环带弧线领航——目标与本人不在同一弧段时，先沿 r=31 圆弧走，
   * 避免员工图省事直线穿过中庭上空。 */
  function arcSteer(ax, az, tx, tz) {
    const ra = Math.hypot(ax, az), rt = Math.hypot(tx, tz);
    if (ra < 26 || rt < 26) return [tx, tz];
    let da = Math.atan2(tz, tx) - Math.atan2(az, ax);
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    if (Math.abs(da) < 0.96) return [tx, tz];
    const sa = Math.atan2(az, ax) + (da > 0 ? 0.88 : -0.88);
    return [Math.cos(sa) * 38, Math.sin(sa) * 38];
  }

  function applyAgentAction(a, d, t, dt) {
    const P = d.parts;
    if (!P) return;
    let axL = 0, axR = 0, azL = 0.18, azR = -0.18, hx = 0, hy = 0;
    if (d.mode === 'seated') {
      d.actionT -= dt;
      if (d.actionT <= 0) {                       // 到期换动作（加权随机）
        const r = Math.random();
        d.action = r < 0.34 ? 'type' : r < 0.50 ? 'mouse' : r < 0.60 ? 'drink'
          : r < 0.70 ? 'phone' : r < 0.78 ? 'read' : r < 0.86 ? 'think'
          : r < 0.93 ? 'wave' : r < 0.97 ? 'stretch' : 'idle';
        d.actionT = 6 + Math.random() * 14;
        d.actionPhase = Math.random() * Math.PI * 2;
      }
      const ph = d.actionPhase, k = t * 7 + ph;
      switch (d.action) {
        case 'type':                               // 双手打字：交替敲击
          axL = -1.05 + Math.sin(k) * 0.12; axR = -1.05 + Math.sin(k + 2.4) * 0.12; break;
        case 'mouse':                              // 右手鼠标偶尔点击，左手撑桌
          axR = -1.15 + (Math.sin(k * 0.6) > 0.92 ? -0.18 : 0);
          axL = -0.9 + Math.sin(k * 0.5) * 0.06; break;
        case 'drink':                              // 周期性举杯喝水
          { const c = Math.max(0, Math.sin(t * 0.9 + ph));
            axR = -0.2 - c * 2.2; azR = -0.18 - c * 0.2; hx = c * 0.12; break; }
        case 'phone':                              // 左手扶耳通话 + 不时点头
          axL = -0.2; azL = 2.55 + Math.sin(t * 0.7 + ph) * 0.06;
          hy = Math.sin(t * 1.3 + ph) * 0.12; break;
        case 'read':                               // 低头看文件
          hx = 0.42; axL = -0.75; axR = -0.55 + Math.sin(k * 0.4) * 0.05; break;
        case 'think':                              // 右手托腮 + 微微仰头
          axR = -1.9 + Math.sin(k * 0.3) * 0.05; azR = 0.45; hx = -0.2; break;
        case 'wave':                               // 右手举起挥手打招呼
          azR = 1.85 + Math.sin(t * 7 + ph) * 0.32; axR = -0.35 + Math.sin(t * 7 + ph) * 0.28; break;
        case 'stretch':                            // 伸懒腰：双臂上举 + 仰头
          { const c = Math.max(0, Math.sin(t * 0.8 + ph));
            azL = 0.18 - c * 2.58; azR = -0.18 + c * 2.58; hx = -c * 0.28; break; }
        default:                                   // 闲坐：呼吸 + 偶尔转头
          axL = Math.sin(k * 0.3) * 0.08; axR = -Math.sin(k * 0.3) * 0.08;
          hy = Math.sin(t * 0.4 + ph) * 0.35;
      }
    } else if (d.mode !== 'riding') {              // 走路/等梯：双臂自然摆动
      axL = Math.sin(t * 9 + d.ph) * 0.4;
      axR = -Math.sin(t * 9 + d.ph) * 0.4;
    } else return;                                 // 乘梯隐身中，不驱动
    const s = Math.min(1, dt * 6);                 // 平滑过渡
    P.armL.rotation.x += (axL - P.armL.rotation.x) * s;
    P.armR.rotation.x += (axR - P.armR.rotation.x) * s;
    P.armL.rotation.z += (azL - P.armL.rotation.z) * s;
    P.armR.rotation.z += (azR - P.armR.rotation.z) * s;
    P.head.rotation.x += (hx - P.head.rotation.x) * s;
    P.head.rotation.y += (hy - P.head.rotation.y) * s;
  }

  /* ---------------- HUD 时间显示 ---------------- */
  let hudEls = null, hudTick = 0;
  function getHud() {
    if (!hudEls) {
      hudEls = {
        clock: document.getElementById('clock'),
        period: document.getElementById('period'),
        slider: document.getElementById('time-slider'),
        rush: document.getElementById('rush'),
        work: document.getElementById('work')
      };
    }
    return hudEls;
  }

  /* ---------------- 动画主循环 ---------------- */
  const clock = new THREE.Clock();
  let raf = 0;
  function animate() {
    raf = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    /* ---- 24 小时时间流转 ---- */
    if (timeState.auto) timeState.h = (timeState.h + dt * timeState.speed / 60) % 24;
    timeState.rush = (timeState.h >= 8 && timeState.h < 9) || (timeState.h >= 17 && timeState.h < 18);
    timeState.work = isWorkHour(timeState.h);
    updateDayNight(timeState.h);

    // 相机补间
    if (camTween) {
      camTween.t = Math.min(1, camTween.t + dt * 0.7);
      const k = camTween.t < 0.5 ? 2 * camTween.t * camTween.t : 1 - Math.pow(-2 * camTween.t + 2, 2) / 2;
      camera.position.lerpVectors(camTween.from, camTween.to, k);
      controls.target.lerpVectors(camTween.tf, camTween.tt, k);
      if (camTween.t >= 1) camTween = null;
    }
    controls.update();
    // v17 中央镜头 zoom 穿心：推近到锚点 6m 内时锚点沿视线前移，可贴近每一层对面的人
    if (centerMode && !centerCustom && !camTween) {
      const vd = controls.target.clone().sub(camera.position);
      const dist = vd.length();
      if (dist < 6 && dist > 0.001) {
        const nt = controls.target.clone().addScaledVector(vd.normalize(), 6 - dist);
        if (Math.hypot(nt.x, nt.z) <= 26) controls.target.copy(nt);
      }
      const cr = Math.hypot(camera.position.x, camera.position.z);
      if (cr > 30.5) { const kk = 30.5 / cr; camera.position.x *= kk; camera.position.z *= kk; }
    }
    // v19 中央轨道：相机钉在内圆玻璃轨道上（θ 绕圈 / cR 缩放 / cYOff 高度），视线朝本层环带
    if (centerMode && centerCustom && !camTween) {
      camera.position.set(cR * Math.cos(cTheta), floorY(cFloor) + 1.7 + cYOff, cR * Math.sin(cTheta));
      controls.target.set(38 * Math.cos(cTheta), floorY(cFloor) + 1.2 + cYOff * 0.6, 38 * Math.sin(cTheta));
      camera.lookAt(controls.target);
    }

    /* ---- 电梯系统 ---- */
    updateElevator(dt);

    // 泳池水波光粼粼
    if (poolWater) {
      poolWater.material.emissiveIntensity = 0.32 + 0.14 * Math.sin(t * 1.6) + 0.05 * Math.sin(t * 3.7);
      poolWater.position.y = 0.28 + Math.sin(t * 1.2) * 0.02;
    }
    for (let ci = 0; ci < extraCars.length; ci++) {
      extraCars[ci].position.y = 2.0 + (Math.sin(t * 0.13 + ci * 2.3) * 0.5 + 0.5) * (extraCars[ci].userData.topY || floorY(5));   // v25：Club 梯轿厢可达 6F
    }
    // 舞池呼吸 + 星光闪烁
    if (danceFloor) danceFloor.material.emissiveIntensity = 0.45 + 0.3 * Math.sin(t * 2.2);
    for (let i = 0; i < starMats.length; i++) {
      starMats[i].emissiveIntensity = 1.6 + Math.sin(t * 3 + i * 0.9) * 0.9;
    }

    // 雕塑等装饰缓慢自转
    for (let i = 0; i < spinners.length; i++) spinners[i].rotation.y += dt * 0.35;

    // 喷泉水柱脉冲（中心主柱 + 内外圈水柱错相缩放）
    for (let i = 0; i < fountainJets.length; i++) {
      const j = fountainJets[i];
      j.scale.y = 0.78 + 0.34 * (0.5 + 0.5 * Math.sin(t * 2.2 + j.userData.phase));
    }

    /* ---- 天空：白云缓慢漂移 ---- */
    for (let i = 0; i < cloudSprites.length; i++) {
      const c = cloudSprites[i];
      c.position.x += dt * c.userData.drift;
      if (c.position.x > 300) c.position.x = -300;
      c.position.y += Math.sin(t * 0.3 + i * 1.7) * dt * 0.5;
    }
    /* ---- 楼外哥斯拉沿闭环路径散步（摆腿/摆臂/摆尾/起伏） ---- */
    updateGodzilla(dt);
    updateRocket(dt);   // v43 火箭发射循环
    updateJet(dt);      // v43 湾流起降循环
    updateExtras(dt, t);

    /* ---- 特工小队：工位就坐 + 楼层漫游 + 电梯通勤 + 旋转滑梯 ---- */
    for (let i = 0; i < agentList.length; i++) {
      const a = agentList[i];
      const d = a.userData;
      if (d.mode === 'riding') continue;
      // v22 作息：不在到/离时间窗内 = 已回家（隐藏）；全员同规，下班后只剩加班的人，深夜走光
      const atHome = d.nightOff && (timeState.h < d.arriveH || timeState.h >= d.leaveH);
      if (atHome) {
        if (d.leisure) { d.leisure.by = null; d.leisure = null; }   // v32：下班走人先释放休闲位
        if (a.visible) a.visible = false;
        if (d.speech && d.speech.visible) { d.speech.visible = false; activeSpeech--; d.speechShow = 0; }

      }
      if (!a.visible) {                                  // 天亮了：回楼上岗
        a.visible = true;

      }
      // 总监定期拜访 5F 主席：计时到期且人在工位/起身活动时，出发去电梯口
      // v9：主席办同时只接待 1 位总监（其余排队稍后再试）；工时总监大多守在专座
      if (d.isDirector && d.homeFloor !== 5 && !d.visitChairman) {
        d.visitT -= dt;
        if (d.visitT <= 0 && timeState.h >= 10.5 && timeState.h < 17 && (d.mode === 'seated' || d.mode === 'stretch' || d.mode === 'wander')) {   // v21：Mike 不在（10:30 前/17:00 后）不拜访
          let onChairmanFloor = 0;                       // 正在主席办寒暄的总监数（已踏上归程的不算）
          for (let j = 0; j < agentList.length; j++) {
            const od = agentList[j].userData;
            if (od.isDirector && od.homeFloor !== 5 && od.curFloor === 5 && !od.goingHome) onChairmanFloor++;
          }
          if (onChairmanFloor >= 1) {
            d.visitT = 30 + Math.random() * 30;          // 主席办已有总监，稍后再试
          } else {
            d.visitChairman = true;
            d.mode = 'toElevator'; d.goingHome = false; setLiftTarget(d);
          }
        }
      }
      if (d.mode === 'seated') {
        // 就坐工位：轻微晃动（打字/呼吸），偶尔起身
        d.seatTimer -= dt;
        if (d.leisureT > 0) d.leisureT -= dt;   // v32 休闲冷却
        a.position.set(
          d.seatX + Math.sin(t * 1.6 + d.ph) * 0.035,
          d.baseY - 0.18 + Math.sin(t * 2.4 + d.ph) * 0.015,
          d.seatZ + Math.cos(t * 1.2 + d.ph) * 0.035
        );
        a.rotation.y = d.seatRotY;
        if (d.seatTimer <= 0) {
          // 工作时间（9:00-12:30 / 13:30-18:00）大多数人守在工位上；chairman（Mike）作息随意不强制
          const workNow = timeState.work && d.en !== 'Mike';
          d.seatTimer = workNow ? 150 + Math.random() * 150 : 30 + Math.random() * 60;
          const roll = Math.random();
          if (!d.visitChairman && tryLeisure(d)) {
            // v32：去健身房/街机室活动一阵（tryLeisure 内已设好模式与目标）
          } else if (d.visitChairman) {
            d.mode = 'toElevator'; d.goingHome = false; setLiftTarget(d);   // 拜访主席执念：起身直奔电梯
          } else if (d.isDirector && d.homeFloor !== 5 && roll < (workNow ? 0.15 : 0.35)) {
            // 总监抽空走到部门里和员工交谈（本层漫步 20-60s 后回座）
            d.mode = 'stretch'; d.talkWalk = true;
            d.tx = d.cx + (Math.random() - 0.5) * d.r * 1.8;
            d.tz = d.cz + (Math.random() - 0.5) * d.r * 1.8;
            d.stretchT = 20 + Math.random() * 40;
          } else if (!d.isDirector && d.curFloor >= 2 && d.curFloor <= 6 && d.homeFloor !== 5 && roll < (workNow ? 0.02 : 0.2)) {
            d.mode = 'toSlide';                                   // 去滑旋转滑梯（2F~6F 每层可滑）
          } else if (!d.isDirector && d.homeFloor !== 5 && roll < (workNow ? (timeState.rush ? 0.3 : 0.05) : 0.4)) {
            // 5F 的 Mike/Mandy 常驻本层，不坐电梯通勤
            d.mode = 'toElevator'; d.goingHome = false; setLiftTarget(d);
          } else if (!workNow || roll < 0.1) {
            d.mode = 'stretch';                                   // 起身在工位附近活动
            d.tx = d.seatX + (Math.random() - 0.5) * 7;
            d.tz = d.seatZ + (Math.random() - 0.5) * 7;
            d.stretchT = 5 + Math.random() * 8;
          }
          // 其余（工时内约 90%）：继续坐在工位上（计时已重置）
        }
      } else if (d.mode === 'stretch') {
        // 起身在工位附近走动，然后回座（talkWalk：总监边走边和员工交谈，步速放慢）
        const dx = d.tx - a.position.x, dz = d.tz - a.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.3) {
          d.stretchT -= dt;

        } else {
          const spd = d.talkWalk ? d.speed * 0.55 : d.speed;
          a.position.x += dx / dist * spd * dt;
          a.position.z += dz / dist * spd * dt;
          a.rotation.y = Math.atan2(dx, dz);
          a.position.y = d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06;
        }
      } else if (d.mode === 'toSeat') {
        // 走回工位就坐
        d.talkWalk = false;
        const dx = d.seatX - a.position.x, dz = d.seatZ - a.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.25) {
          d.mode = 'seated';
          // 等电梯超时回来的拜访者：稍作停留即再试，不让拜访计划泡汤
          // 工时内回座后坐得久（150-300s），chairman 除外
          const workNow = timeState.work && d.en !== 'Mike';
          d.seatTimer = d.visitChairman ? 4 + Math.random() * 8
            : (workNow ? 150 + Math.random() * 150 : 30 + Math.random() * 60);
        } else {
          const stp = arcSteer(a.position.x, a.position.z, d.seatX, d.seatZ);
          const sdx = stp[0] - a.position.x, sdz = stp[1] - a.position.z;
          const sdist = Math.hypot(sdx, sdz) || 1;
          a.position.x += sdx / sdist * d.speed * dt;
          a.position.z += sdz / sdist * d.speed * dt;
          a.rotation.y = Math.atan2(sdx, sdz);
          a.position.y = d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06;
        }
      } else if (d.mode === 'toSlide') {
        // 前往本层滑梯入口（管口）
        const en = slide.entries[d.curFloor];
        if (!en) { d.mode = 'seated'; d.seatTimer = 20; }
        else {
          const dx = en.x - a.position.x, dz = en.z - a.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 0.4) {
            d.mode = 'sliding';
            d.slideT = en.t;
            d.slideDur = 7 * (1 - en.t) + 0.5;   // 楼层越高滑得越久（6F≈7.2s，2F≈2.6s）
          } else {
            const stp = arcSteer(a.position.x, a.position.z, en.x, en.z);
            const sdx = stp[0] - a.position.x, sdz = stp[1] - a.position.z;
            const sdist = Math.hypot(sdx, sdz) || 1;
            a.position.x += sdx / sdist * d.speed * dt;
            a.position.z += sdz / sdist * d.speed * dt;
            a.rotation.y = Math.atan2(sdx, sdz);
            a.position.y = d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06;
          }
        }
      } else if (d.mode === 'sliding') {
        // 沿螺旋管一路滑到 1F
        d.slideT += dt / d.slideDur;
        if (d.slideT >= 1) {
          a.position.set(slide.exit.x, floorY(1), slide.exit.z);
          d.curFloor = 1;
          d.baseY = floorY(1);
          d.mode = 'exitWalk';
          d.tx = -22; d.tz = -27;
          d.afterExit = 'returnWait';
          d.returnT = 6 + Math.random() * 10;
        } else if (slide.curve) {
          const p = slide.curve.getPoint(d.slideT);
          const p2 = slide.curve.getPoint(Math.min(1, d.slideT + 0.012));
          a.position.set(p.x, p.y + 0.55, p.z);
          a.rotation.y = Math.atan2(p2.x - p.x, p2.z - p.z);
        }
      } else if (d.mode === 'wander') {
        d.tripTimer -= dt;
        if (d.tripTimer <= 0) {
          d.tripTimer = timeState.rush ? 4 + Math.random() * 6 : 12 + Math.random() * 18;
          if (Math.random() < (timeState.rush ? 0.8 : 0.35)) {
            d.mode = 'toElevator'; d.goingHome = false; setLiftTarget(d);
          }
        }
        const x = d.cx + d.ax * Math.sin(t * d.w1 + d.ph);
        const z = d.cz + d.az * Math.cos(t * d.w2 + d.ph * 1.3);
        const dx = d.ax * d.w1 * Math.cos(t * d.w1 + d.ph);
        const dz = -d.az * d.w2 * Math.sin(t * d.w2 + d.ph * 1.3);
        a.position.set(x, d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06, z);
        if (dx * dx + dz * dz > 1e-6) a.rotation.y = Math.atan2(dx, dz);
      } else if (d.mode === 'toElevator' || d.mode === 'exitWalk') {
        const dx = d.tx - a.position.x, dz = d.tz - a.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.3) {
          if (d.mode === 'toElevator') { d.mode = 'waitDoor'; d.waitT = 0; }
          else { d.mode = d.afterExit; d.tripTimer = 3 + Math.random() * 5; }
        } else {
          const stp = arcSteer(a.position.x, a.position.z, d.tx, d.tz);
          const sdx = stp[0] - a.position.x, sdz = stp[1] - a.position.z;
          const sdist = Math.hypot(sdx, sdz) || 1;
          a.position.x += sdx / sdist * d.speed * dt;
          a.position.z += sdz / sdist * d.speed * dt;
          a.rotation.y = Math.atan2(sdx, sdz);
          a.position.y = d.baseY + Math.abs(Math.sin(t * 6 + d.ph)) * 0.06;
        }
      } else if (d.mode === 'waitDoor') {
        d.waitT += dt;
        if (d.waitT > 30) {
          // 等电梯超时：有工位者走回座位（避免长期滞留电梯口造成拥塞），无工位者继续漫游
          if (d.leisure) { d.leisure.by = null; d.leisure = null; }   // v32：等不到梯就放弃休闲
          d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander';

        else if (d.goingHome && d.homeFloor === d.curFloor) {

          d.mode = (d.seatX !== undefined) ? 'toSeat' : 'wander';

        else if (d.atClub) {

          if (d.waitT > 1.3) {
            d.destFloor = d.goingHome ? d.homeFloor : (d.curFloor === 6 ? [1, 2, 3, 4][Math.floor(Math.random() * 4)] : 6);
            if (d.destFloor === d.curFloor) d.destFloor = d.curFloor === 6 ? 1 : 6;
            d.clubFromY = floorY(d.curFloor); d.clubToY = floorY(d.destFloor);
            d.clubDur = 1.6 + Math.abs(d.destFloor - d.curFloor) * 0.55; d.clubT = 0;

            d.destFloor = 5;                                     // 总监定期上 5F 拜会主席
            d.visitChairman = false;
            d.visitT = timeState.work ? 600 + Math.random() * 600 : 360 + Math.random() * 240;  // 下次拜访
          } else if (d.leisure) {
            d.destFloor = d.leisure.floor;   // v32：休闲出行去器材所在层
          } else if (d.isDirector && (function () {
            let n = 0;                                           // 主席办同时只 1 位总监：已有访客则本次不上去
            for (let j = 0; j < agentList.length; j++) {
              const od = agentList[j].userData;
              if (od.isDirector && od.homeFloor !== 5 && od.curFloor === 5 && !od.goingHome) n++;
            }
            return n < 1 && Math.random() < 0.3;
          })()) {

          }
